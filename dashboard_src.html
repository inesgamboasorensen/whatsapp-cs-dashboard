<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análisis WhatsApp Customer Success Agents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#1B2A4A', dark: '#0F1A33', card: '#1F2E52', light: '#253A5E' },
            coral: { DEFAULT: '#E8505B', light: '#FEE2E2' },
            teal: { DEFAULT: '#2EC4B6', light: '#D1FAE5' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      background: #FAFAF7;
      color: #0F1A33;
    }
    /* Subtle warm ambient gradient for the whole app */
    .app-bg {
      background:
        radial-gradient(ellipse 60% 40% at 0% 30%, rgba(46, 196, 182, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 60%, rgba(232, 80, 91, 0.04) 0%, transparent 50%),
        #FAFAF7;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0F1A33; }
    ::-webkit-scrollbar-thumb { background: #2EC4B6; border-radius: 4px; }
    @keyframes growBar { from { width: 0; } }
    .animate-bar { animation: growBar 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes drawDonut { from { stroke-dashoffset: var(--circumference); } }
    .donut-segment { animation: drawDonut 1s ease-out forwards; }
    /* Atmospheric hero — warm fog at the bottom, like Legend */
    .hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(232, 80, 91, 0.13) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(232, 168, 87, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 100%, rgba(168, 142, 217, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, #FAFAF7 0%, #F4F1EA 100%);
    }
    .grid-decoration {
      background-image:
        linear-gradient(to right, rgba(15,26,51,0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15,26,51,0.035) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 90%);
    }
    .glass {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    @keyframes blurIn { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    .animate-blur-in { animation: blurIn 0.8s ease-out forwards; opacity: 0; }
    .hero-number {
      font-feature-settings: 'tnum' 1;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .coords {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: rgba(15,26,51,0.4);
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Pinned to Babel 7: v8 makes preset-react emit ESM `import` which breaks the in-browser transformer (blank page). Do not float to @latest. -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    // ─── DATA ───
    // Los datos NO viven en este archivo: vienen de data.json, que genera el
    // pipeline de análisis (whatsapp_analysis/update_dashboard_data.py).
    // Para publicar una corrida nueva se reemplaza data.json — este archivo
    // no se toca. Contrato de datos: ver DATA_SCHEMA.md
    function boot(D) {
    const PERIOD              = D.PERIOD;
    const PERIOD_NEW          = D.PERIOD_NEW;
    const runsMeta            = D.runsMeta;
    const topRequests         = D.topRequests;
    const frustrationSeverity = D.frustrationSeverity;
    const frustrationCauses   = D.frustrationCauses;
    const agentRanking        = D.agentRanking;
    const resolutionData      = D.resolutionData;
    const resolutionMonthly   = D.resolutionMonthly;
    const writingQuality      = D.writingQuality;
    const responseTimes       = D.responseTimes;
    const problemEvolution    = D.problemEvolution;
    const improvementAreas    = D.improvementAreas;
    const activityData        = D.activityData;
    const contractHandling    = D.contractHandling;
    const volumeData          = D.volumeData;
    const metricsMonthly      = D.metricsMonthly;
    const firstResponse       = D.firstResponse;   // opcional: lo escribe compute_first_response.py

    // ── Mediciones ──────────────────────────────────────────────────────────
    // Antes cada medición estaba escrita a mano en el código (a.aug13, a.jul22…),
    // así que publicar una nueva exigía editar ~40 lugares. Ahora la lista viene
    // de data.json: agregar una medición es agregar una entrada ahí, sin tocar
    // este archivo. mediciones[] va de la más vieja a la más reciente.
    // Una medición marcada "invalida" en data.json se deja fuera de todas las
    // tendencias (no se borra: queda el registro y su motivo). Hoy: sep 1 y sep 15.
    const MED_EXCLUIDAS = D.mediciones.filter(m => m.invalida);
    const MED       = D.mediciones.filter(m => !m.invalida);
    const MED_ULT   = MED[MED.length - 1];              // la medición actual
    const MED_1RA   = MED[0];
    const medKeys   = MED.map(m => m.key);

    // valores de un agente, en orden, sin huecos
    const medValores = a => medKeys.map(k => a?.[k]).filter(v => v !== null && v !== undefined);
    // su valor más reciente (la última medición en la que aparece)
    const medUltimo  = a => { for (let i = MED.length - 1; i >= 0; i--) {
                                const v = a?.[MED[i].key];
                                if (v !== null && v !== undefined) return v;
                              } return null; };
    // ¿el agente aparece en alguna medición?
    const medTiene   = a => medKeys.some(k => a?.[k] !== null && a?.[k] !== undefined);
    // promedio del equipo en una medición (usa `equipo` de data.json si está)
    const medPromedio = m => {
      if (m.equipo !== null && m.equipo !== undefined) return m.equipo;  // texto: se muestra tal cual
      const vs = agentRanking.map(a => a[m.key]).filter(v => v !== null && v !== undefined);
      return vs.length ? (vs.reduce((s, v) => s + v, 0) / vs.length).toFixed(1) : null;
    };

    // Presentación derivada de runsMeta — esto es código, no dato.
    const overviewStats = [
      { label: "Corridas Realizadas",       value: String(runsMeta.totalRuns),           sub: runsMeta.runsSub,                     icon: "🔁", accent: "#2EC4B6" },
      { label: "Última Corrida",            value: runsMeta.lastRunLabel,                sub: runsMeta.lastRunSub,                  icon: "📅", accent: "#1B2A4A" },
      { label: "Agentes en Última Corrida", value: String(runsMeta.agentsLastRun),       sub: "Cuentas conectadas a Evolution API", icon: "👥", accent: "#F97316" },
      { label: "Total Agentes Analizados",  value: String(runsMeta.totalAgentsAnalyzed), sub: "Histórico desde Mar 11",             icon: "📊", accent: "#E8505B" },
    ];

    // Nota que explica las mediciones excluidas — va junto a cada tendencia de frustración
    function NotaExcluidas({ dark }) {
      if (!MED_EXCLUIDAS.length) return null;
      return (
        <p className={`text-xs mt-3 ${dark ? 'text-gray-400' : 'text-gray-500'}`}>
          <span className="font-semibold">Se excluyen {MED_EXCLUIDAS.map(m => m.label.toLowerCase()).join(' y ')}:</span>{' '}
          {MED_EXCLUIDAS[0].motivo}
        </p>
      );
    }

    // ─── COMPONENTS ───
    function Header({ onToggleNav, activeLabel }) {
      return (
        <header className="sticky top-0 z-50 border-b border-navy-light" style={{background: 'rgba(15,26,51,0.97)', backdropFilter: 'blur(12px)'}}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
            <div className="flex items-center gap-2.5 min-w-0">
              <button onClick={onToggleNav} aria-label="Abrir menú" className="shrink-0 text-white/80 hover:text-white p-1.5 -ml-1.5 rounded-md hover:bg-white/10 transition-colors">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
              </button>
              <div className="w-1.5 h-7 bg-gradient-to-b from-teal to-teal/40 rounded-full shrink-0 hidden sm:block"></div>
              <h1 className="text-sm sm:text-base font-semibold text-white tracking-tight truncate">
                <span className="text-gray-400 font-normal">MoradaUno</span> · Análisis WhatsApp CS
                {activeLabel && <span className="text-gray-500 font-normal hidden md:inline"> · {activeLabel}</span>}
              </h1>
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <span className="hidden md:inline text-[10px] font-mono text-gray-500 tracking-widest">{(firstResponse ? `Datos al ${fechaCorta(firstResponse.generatedAt)}` : PERIOD).toUpperCase()}</span>
              <span className="flex items-center gap-1.5 text-[10px] font-mono text-teal/80 bg-teal/10 border border-teal/20 rounded-full px-2.5 py-1">
                <span className="w-1.5 h-1.5 rounded-full bg-teal animate-pulse"></span>
                LIVE
              </span>
            </div>
          </div>
        </header>
      );
    }

    function Section({ title, dark, children, id }) {
      return (
        <section id={id} className={`py-12 sm:py-20 ${dark ? 'bg-navy-dark' : ''}`} style={!dark ? {background: 'transparent'} : undefined}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6">
            {title && (
              <div className="mb-10 flex items-end justify-between flex-wrap gap-2">
                <div>
                  <div className={`text-[10px] font-mono tracking-widest uppercase ${dark ? 'text-teal/60' : 'text-gray-400'}`}>{(id || '').toUpperCase().replace(/-/g, ' / ')}</div>
                  <h2 className={`mt-1 text-3xl sm:text-4xl font-extrabold tracking-tight ${dark ? 'text-white' : 'text-navy-dark'}`}>{title}</h2>
                </div>
                <div className={`hidden sm:block h-px flex-1 ml-8 ${dark ? 'bg-white/10' : 'bg-navy-dark/10'}`}></div>
              </div>
            )}
            {children}
          </div>
        </section>
      );
    }

    function ReminderCard() {
      // El análisis corre solo el día 1 y el 15 de cada mes. Esta tarjeta ya no
      // le recuerda a nadie que lo corra: dice cuándo toca la próxima.
      const lastRun = new Date(runsMeta.lastRunDate + 'T12:00:00');
      const today = new Date();
      const daysSince = Math.floor((today - lastRun) / (1000 * 60 * 60 * 24));

      const proxima = (() => {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        if (d.getDate() < 15) return new Date(d.getFullYear(), d.getMonth(), 15);
        return new Date(d.getFullYear(), d.getMonth() + 1, 1);
      })();
      const daysUntilNext = Math.max(0, Math.ceil((proxima - today) / (1000 * 60 * 60 * 24)));
      const fmt = f => f.toLocaleDateString('es-MX', { day: 'numeric', month: 'long' });

      // Si pasaron más de 16 días sin corrida, la automatización falló.
      const overdue = daysSince > 16;
      const soon = false;
      const color = overdue ? '#E8505B' : '#2EC4B6';
      const bg = overdue ? 'from-coral/10 to-coral/5' : 'from-teal/10 to-teal/5';
      const icon = overdue ? '🚨' : '🤖';
      const message = overdue
        ? `Han pasado ${daysSince} días sin medición nueva. La corrida automática debió ejecutarse — revisa GitHub Actions.`
        : `Próxima corrida automática: ${fmt(proxima)} (en ${daysUntilNext} ${daysUntilNext === 1 ? 'día' : 'días'}).`;
      return (
        <div className={`relative overflow-hidden rounded-2xl bg-gradient-to-br ${bg} border p-5 mb-6`} style={{borderColor: color + '40'}}>
          <div className="flex items-start justify-between gap-4 flex-wrap">
            <div className="flex items-start gap-3">
              <div className="text-2xl">{icon}</div>
              <div>
                <p className="text-xs font-bold uppercase tracking-wider" style={{color}}>{overdue ? 'Revisar' : 'Corre automáticamente'}</p>
                <p className="text-sm font-semibold text-navy-dark mt-0.5">{message}</p>
                <p className="text-xs text-gray-500 mt-1">Última corrida: {new Date(runsMeta.lastRunDate).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })} · Hace {daysSince} {daysSince === 1 ? 'día' : 'días'}</p>
              </div>
            </div>
            {(overdue || soon) && (
              <a href="#how-to-run" onClick={(e) => { e.preventDefault(); document.getElementById('how-to-run')?.scrollIntoView({behavior: 'smooth'}); }}
                className="text-xs font-semibold px-3 py-2 rounded-full hover:opacity-90 transition-opacity shrink-0" style={{backgroundColor: color, color: 'white'}}>
                Ver qué revisar →
              </a>
            )}
          </div>
        </div>
      );
    }

    function HowToRunCard() {
      return (
        <div id="how-to-run" className="rounded-2xl bg-navy-dark p-6 mb-6 mt-6">
          <p className="text-teal text-xs font-bold uppercase tracking-wider mb-2">Cómo funciona</p>
          <h3 className="text-white text-xl font-bold mb-1">El análisis corre solo</h3>
          <p className="text-gray-400 text-sm mb-4">
            Nadie tiene que correr nada. Estos son los dos procesos automáticos y qué hacer si algo falla.
          </p>
          <div className="space-y-3 text-sm text-gray-300">
            <div className="flex gap-3">
              <span className="text-teal font-mono shrink-0">📅</span>
              <div>
                <strong className="text-white">Todos los días, 6:00 AM</strong> — Se descargan las conversaciones
                nuevas y se guardan en la base de datos. Ahí queda el histórico completo, consultable para
                cualquier análisis, no solo para este dashboard.
              </div>
            </div>
            <div className="flex gap-3">
              <span className="text-teal font-mono shrink-0">📊</span>
              <div>
                <strong className="text-white">El día 1 y el 15 de cada mes, 7:00 AM</strong> — Claude lee las
                conversaciones de la quincena y las clasifica (frustración, resolución, contratos). El dashboard
                se actualiza solo con la medición nueva.
              </div>
            </div>
            <div className="flex gap-3">
              <span className="text-teal font-mono shrink-0">🔍</span>
              <div>
                <strong className="text-white">Si una corrida falla</strong> — Casi siempre es que hay instancias
                de WhatsApp desconectadas. Ábrelas en el{' '}
                <a href="http://165.232.159.10:8080/manager/" target="_blank" className="text-teal underline">Evolution Manager</a>,
                reconecta las que estén en "close", y vuelve a disparar la corrida desde{' '}
                <a href="https://github.com/inesgamboasorensen/whatsapp-cs-analysis/actions" target="_blank" className="text-teal underline">GitHub Actions</a>.
              </div>
            </div>
            <div className="flex gap-3">
              <span className="text-teal font-mono shrink-0">🛡️</span>
              <div>
                <strong className="text-white">No publica datos rotos</strong> — Antes de actualizar el dashboard,
                la corrida verifica que haya suficientes agentes y conversaciones. Si vienen a la mitad, se detiene
                y no publica nada.
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StatsCards() {
      return (
        <Section title="Resumen General" id="stats">
          <ReminderCard />
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            {overviewStats.map((s, i) => (
              <div key={i} className="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all duration-300 animate-fade hover:-translate-y-0.5" style={{borderLeft: `3px solid ${s.accent}`, animationDelay: `${i * 0.08}s`}}>
                <div className="text-2xl mb-3 opacity-80 group-hover:opacity-100 transition-opacity">{s.icon}</div>
                <div className="text-4xl font-extrabold tracking-tight" style={{color: s.accent}}>{s.value}</div>
                <div className="text-sm text-gray-700 mt-1 font-semibold">{s.label}</div>
                {s.sub && <div className="text-xs text-gray-400 mt-1">{s.sub}</div>}
              </div>
            ))}
          </div>
          <HowToRunCard />
        </Section>
      );
    }

    function ComparisonSection() {
      // un promedio por medición, calculado o tomado de data.json
      return (
        <Section title={`Evolución de Frustración (${MED.length} Mediciones)`} dark id="comparison">
          {/* Big KPI - 7 columns */}
          <div className="grid grid-cols-2 gap-4 mb-10" style={{gridTemplateColumns: `repeat(${MED.length}, minmax(0, 1fr))`}}>
            {MED.map(m => (
              <div key={m.key} className="bg-navy-card rounded-xl p-5 text-center"
                   style={m.key === MED_ULT.key ? {border: '1px solid rgba(34,197,94,0.5)'} : undefined}>
                <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">{m.kpi}</div>
                <div className={`text-3xl font-extrabold ${m.clase}`}>{medPromedio(m)}%</div>
                <div className="text-gray-500 text-xs mt-1">{m.agentes} agentes</div>
              </div>
            ))}
          </div>
          <div className="-mt-6 mb-10"><NotaExcluidas dark /></div>
          {/* Per-agent sparkline - clearer trajectory view */}
          <div className="bg-navy-card rounded-xl p-6 sm:p-8">
            <div className="flex items-baseline justify-between flex-wrap gap-2 mb-6">
              <h3 className="text-white text-lg font-bold">Trayectoria de Frustración por Agente</h3>
              <div className="text-xs text-gray-400 flex gap-3 flex-wrap">
                <span>📈 Subió</span>
                <span>📉 Bajó (mejoró)</span>
                <span>➡️ Sin cambio</span>
                <span className="text-gray-500">| Bajo % = mejor</span>
              </div>
            </div>

            {/* Leyenda de colores — una entrada por medición */}
            <div className="flex flex-wrap gap-x-4 gap-y-1.5 mb-4 text-[11px] text-gray-400">
              {MED.map(m => (
                <span key={m.key} className="inline-flex items-center gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ background: m.color }}></span>{m.label}
                </span>
              ))}
              <span className="text-gray-500">· línea punteada = umbral 30% · bajo % = mejor</span>
            </div>

            {/* Header row */}
            <div className="grid items-center gap-3 mb-3 pb-2 border-b border-navy-light/50" style={{gridTemplateColumns: '170px 64px 1fr 70px 78px'}}>
              <div className="text-xs text-gray-500 uppercase tracking-wide">Agente</div>
              <div className="text-xs text-gray-500 uppercase tracking-wide text-right">1ª medición</div>
              <div className="text-xs text-gray-500 uppercase tracking-wide text-center">{`Trayectoria de frustración (${MED_1RA.label} → ${MED_ULT.label})`}</div>
              <div className="text-xs text-gray-500 uppercase tracking-wide text-right">{MED_ULT.label}</div>
              <div className="text-xs text-gray-500 uppercase tracking-wide text-right">Cambio</div>
            </div>

            <div className="space-y-2">
              {agentRanking
                .filter(medTiene)
                .sort((a, b) => (medUltimo(b) ?? -1) - (medUltimo(a) ?? -1))
                .map((a, i) => {
                  // Build sequence of points (with which measurement each is)
                  const points = MED.map(m => ({ date: m.label, value: a[m.key], color: m.color }));
                  const valid = points.map((p, idx) => ({...p, idx})).filter(p => p.value !== null && p.value !== undefined);
                  if (valid.length === 0) return null;
                  const start = valid[0];
                  const end = valid[valid.length - 1];
                  const delta = valid.length >= 2 ? end.value - start.value : null;
                  const trendIcon = delta === null ? '🆕' : delta < -3 ? '📉' : delta > 3 ? '📈' : '➡️';
                  // 'mejoró' if delta < 0 (less frustration), 'empeoró' if positive
                  const deltaColor = delta === null ? '#94A3B8' : delta < -3 ? '#22C55E' : delta > 3 ? '#E8505B' : '#94A3B8';
                  // Convert frustration % to y-axis (inverted: 0 at top means 100% frustration)
                  // 9 slots now (indices 0-8) — divide by 8 in xFor
                  const W = 600, H = 80, PAD = 16;
                  const xFor = (slot) => PAD + (slot / 8) * (W - PAD * 2);
                  const yFor = (val) => PAD + ((100 - val) / 100) * (H - PAD * 2);

                  // Build path
                  const pathD = valid.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${xFor(p.idx)} ${yFor(p.value)}`).join(' ');

                  return (
                    <div key={i} className="grid items-center gap-3 hover:bg-navy-dark/30 rounded-lg p-2 -mx-2 transition-colors" style={{gridTemplateColumns: '170px 64px 1fr 70px 78px'}}>
                      {/* Name */}
                      <div className="text-sm text-white font-medium truncate">
                        {a.name}
                        {a.isBrandNew && <span className="ml-1.5 text-[9px] text-teal bg-teal/20 px-1 py-0.5 rounded">NUEVO</span>}
                      </div>
                      {/* Start value */}
                      <div className="text-right">
                        <span className="text-sm font-bold" style={{color: start.color}}>{start.value}%</span>
                        <div className="text-[10px] text-gray-500">{start.date}</div>
                      </div>
                      {/* Sparkline SVG */}
                      <div className="relative">
                        <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" className="w-full" style={{height: '60px'}}>
                          {/* Reference grid: light dashed line at 30% (acceptable threshold) */}
                          <line x1={PAD} y1={yFor(30)} x2={W - PAD} y2={yFor(30)} stroke="#475569" strokeWidth="1" strokeDasharray="4,4"/>
                          {/* Connector line */}
                          {valid.length >= 2 && (
                            <path d={pathD} fill="none" stroke={deltaColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.85"/>
                          )}
                          {/* Dots — label only first & last to reduce clutter; others show on hover */}
                          {valid.map((p, idx) => {
                            const isEdge = idx === 0 || idx === valid.length - 1;
                            return (
                              <g key={idx}>
                                <circle cx={xFor(p.idx)} cy={yFor(p.value)} r={idx === valid.length - 1 ? 6 : isEdge ? 5 : 4} fill={p.color} opacity={isEdge ? 1 : 0.7}>
                                  <title>{p.date}: {p.value}%</title>
                                </circle>
                                {isEdge && (
                                  <text x={xFor(p.idx)} y={yFor(p.value) - 10} textAnchor="middle" fill="white" fontSize="12" fontWeight="700" style={{paintOrder: 'stroke', stroke: '#0F1A33', strokeWidth: '3px', strokeLinejoin: 'round'}}>{p.value}%</text>
                                )}
                              </g>
                            );
                          })}
                        </svg>
                      </div>
                      {/* Current value */}
                      <div className="text-right">
                        <span className="text-sm font-bold" style={{color: end.color}}>{end.value}%</span>
                        <div className="text-[10px] text-gray-500">{end.date}</div>
                      </div>
                      {/* Delta */}
                      <div className="text-right">
                        {delta !== null ? (
                          <>
                            <div className="text-sm font-bold" style={{color: deltaColor}}>
                              {trendIcon} {delta > 0 ? '+' : ''}{delta}
                            </div>
                            <div className="text-[10px] text-gray-500">pts</div>
                          </>
                        ) : (
                          <div className="text-xs text-gray-500">{trendIcon} sólo 1</div>
                        )}
                      </div>
                    </div>
                  );
                })}
            </div>

            <div className="mt-5 pt-4 border-t border-navy-light/40 text-xs text-gray-400">
              Cada punto es una medición · Línea conecta el cambio en el tiempo · Línea punteada gris = umbral aceptable (30%)
            </div>
          </div>
          {/* Key findings */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-6">
            <div className="bg-navy-card border border-teal/30 rounded-xl p-5">
              <p className="text-teal text-sm font-bold mb-2">✅ Hallazgos Positivos</p>
              <ul className="text-gray-300 text-xs space-y-1.5">
                <li>• <strong>Frustración global</strong> bajó de 39.7% (Mar 11) a 16% (Jun 2)</li>
                <li>• <strong>Xel Xanat, Lorena, Karen Pérez y Dana Lugo</strong> en 0% de frustración esta corrida</li>
                <li>• <strong>Jenifer y Kate González</strong> entre las más bajas (8%)</li>
                <li>• <strong>Carlos</strong> sigue sólido (11%) pese a su alto volumen</li>
              </ul>
            </div>
            <div className="bg-navy-card border border-orange-500/30 rounded-xl p-5">
              <p className="text-orange-400 text-sm font-bold mb-2">⚠️ Áreas de Atención</p>
              <ul className="text-gray-300 text-xs space-y-1.5">
                <li>• <strong>Cesar y Elizabeth Castro</strong> las más altas (33%)</li>
                <li>• <strong>Eduardo e Itzel Alarcón</strong> en 30%</li>
                <li>• <strong>Iran</strong> 27% — confunde nombres de brokers, SLAs prometidos</li>
                <li>• Bug recurrente en 5 corridas: pagos no se reflejan en la app</li>
              </ul>
            </div>
          </div>
        </Section>
      );
    }

    // High-level summary of the four pillar metrics for the Resumen tab.
    // Frustración / response time / writing come from the static analysis snapshot;
    // calls hits the live worker so the headline number stays current.
    // ─── RESUMEN ───
    // Cinco métricas, una por pregunta del broker. Lo demás vive en "Diagnóstico":
    // sirve para explicar por qué se movió una de estas, no para seguir la experiencia.
    //   1–2 salen de TODAS las conversaciones (Postgres, compute_first_response.py)
    //   3–4 salen de una muestra leída por Claude (classify.py) → frágiles: ver nota de sep
    //   5   también sale de esa muestra desde el prompt v2 (contractLatest); antes, del análisis de julio
    const RES_MIN_N = 30;   // por debajo, el % de un agente se mueve mucho con 1–2 casos
    const DIAS_VIEJO = 45;  // un dato más viejo que esto se marca como desactualizado

    const mesLargo = (k) => { const [y, m] = k.split('-'); return new Date(y, m - 1, 15).toLocaleDateString('es-MX', { month: 'short', year: 'numeric' }); };
    const fechaCorta = (iso) => new Date(iso.length === 10 ? iso + 'T12:00:00-06:00' : iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', timeZone: 'America/Mexico_City' });
    const diasDesde = (iso) => (Date.now() - new Date(iso.length === 7 ? iso + '-28T12:00:00' : iso).getTime()) / 86400000;

    // Resolución: la última corrida si ya la publica agregar_medicion.py; si no, el mes más reciente del análisis anterior
    const resolucionActual = (() => {
      if (D.resolutionLatest) return { ...D.resolutionLatest, periodo: D.resolutionLatest.periodo || fechaCorta(D.resolutionLatest.fecha), fechaRef: D.resolutionLatest.fecha };
      const k = resolutionMonthly.months[resolutionMonthly.months.length - 1];
      return { ...resolutionMonthly.by_month[k], periodo: mesLargo(k), fechaRef: k };
    })();
    // Contratos: la última corrida si ya la publica agregar_medicion.py (prompt v2); si no,
    // el mes con más conversaciones del análisis de julio. by_month es siempre el de julio.
    const contratosActual = (() => {
      if (D.contractLatest) return { ...D.contractLatest, by_month: contractHandling.by_month, periodo: D.contractLatest.periodo || fechaCorta(D.contractLatest.fecha), fechaRef: D.contractLatest.fecha, corrida: true };
      const k = [...contractHandling.by_month].sort((a, b) => b.contractConvs - a.contractConvs)[0].month;
      return { ...contractHandling, periodo: mesLargo(k), fechaRef: k, corrida: false };
    })();

    // Aviso arriba de una pestaña cuyos datos se quedaron atrás
    function AvisoViejo({ que, periodo, detalle }) {
      return (
        <div className="mb-6 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
          <strong>Datos de {periodo}.</strong> {que} {detalle}
        </div>
      );
    }

    // Metas acordadas con Inés (23 oct 2026; primera respuesta relajada el mismo día) y tolerancia por agente: somos humanos,
    // nadie tiene que ser perfecto. Un agente solo se señala si está FUERA de la tolerancia
    // (más o menos el doble de la meta), no por no llegar a ella.
    const REF = {
      over24h:   { bien: 2,  atencion: 3,    tol: 5,   menosMejor: true,  txt: '≤ 2%',       tolTxt: '5%' },
      primera:   { bien: 20, atencion: 30,   tol: 45,  menosMejor: true,  txt: '≤ 20 min',   tolTxt: '45 min' },
      p90:       { bien: 90, atencion: 135,  tol: 180, menosMejor: true,  txt: '≤ 1.5 h hábiles', tolTxt: '3 h' },
      resueltas: { bien: 80, atencion: 70,   tol: 65,  menosMejor: false, txt: '≥ 80%',      tolTxt: '65%' },
      frust:     { bien: 10, atencion: 15,   tol: 20,  menosMejor: true,  txt: '≤ 10%',      tolTxt: '20%' },
      contratos: { bien: 20, atencion: 30,   tol: 35,  menosMejor: true,  txt: '≤ 20%',      tolTxt: '35%' },
    };
    const nivel = (v, r) => v == null ? null
      : (r.menosMejor ? v <= r.bien : v >= r.bien) ? 'bien'
      : (r.menosMejor ? v <= r.atencion : v >= r.atencion) ? 'atencion' : 'mejorar';
    // "a 1.2 pts de la meta" / "cumple la meta"
    const distancia = (v, r, fmt) => {
      if (v == null) return null;
      const d = r.menosMejor ? v - r.bien : r.bien - v;
      return d <= 0 ? 'cumple la meta' : `${fmt(Math.round(d * 10) / 10)} arriba de la meta`.replace('arriba', r.menosMejor ? 'arriba' : 'abajo');
    };
    const prom = (xs) => { const v = xs.filter(x => x != null); return v.length ? Math.round(10 * v.reduce((s, x) => s + x, 0) / v.length) / 10 : null; };
    // El análisis quincenal corre el día 1 y el 15
    const proximaCorrida = (() => {
      const h = new Date(), d = h.getDate() < 15 ? new Date(h.getFullYear(), h.getMonth(), 15) : new Date(h.getFullYear(), h.getMonth() + 1, 1);
      return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
    })();
    const DIAS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

    function Spark({ valores, muted }) {
      const v = valores.filter(x => x != null);
      if (v.length < 2) return <span className="text-[11px] text-gray-300">sin historia</span>;
      const W = 112, H = 30, min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
      const pts = v.map((x, i) => [i * W / (v.length - 1), H - 3 - (x - min) / span * (H - 6)]);
      const color = muted ? '#CBD5E1' : '#1B2A4A';
      return (
        <svg width={W} height={H} className="overflow-visible" aria-hidden="true">
          <polyline points={pts.map(p => p.join(',')).join(' ')} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" />
          <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2.5" fill={color} />
        </svg>
      );
    }

    function Resumen({ onJump }) {
      const F = firstResponse;
      const R = resolucionActual;
      const C = contratosActual, CH = C.team;
      const [orden, setOrden] = React.useState('over24hPct');
      const [llamadas, setLlamadas] = React.useState(null);
      React.useEffect(() => {
        let vivo = true;
        fetch('https://delicate-poetry-a88a.ines-25d.workers.dev/whatsapp-calls', { cache: 'no-store' })
          .then(r => r.json())
          .then(d => {
            if (!vivo || !Array.isArray(d)) return;
            const desde = Date.now() - 28 * 86400000;
            const c = d.filter(x => new Date(x.raw?.data?.date || x.ts).getTime() >= desde);
            setLlamadas({ total: c.length, perdidas: c.filter(x => x.missed).length });
          })
          .catch(() => {});
        return () => { vivo = false; };
      }, []);

      const viejo = (ref) => diasDesde(ref) > DIAS_VIEJO;
      const pct = v => `${v}%`;
      // Periodo del Resumen = la última QUINCENA cerrada, la misma que agrupa la medición
      // de la IA (frustración, resolución, contratos), para que las cinco se lean juntas.
      const QS = (F && F.quincenas) || [];
      const cerradas = QS.filter(q => q.closed);
      const Q = cerradas[cerradas.length - 1] || null;
      const enCurso = QS.find(q => !q.closed) || null;
      const maxN = Math.max(1, ...cerradas.map(q => q.total.threads));
      const parcial = (q) => q.total.threads < 0.5 * maxN;   // antes del tiempo real solo se guardaban los chats recientes
      const T = Q ? Q.total : (F ? F['total'] : null);
      const AG = Q ? Q.agents : (F ? F['agents'] : []);
      const LQ = Q ? Q.late : (F ? F['late'] : null);
      const serieQ = (k) => cerradas.map(q => q.total[k]);
      const previasParciales = cerradas.slice(-4, -1).some(parcial);
      const frustSerie = MED.map(m => Number(medPromedio(m)));
      const frustAct = frustSerie[frustSerie.length - 1];
      const MED_ANT = MED[MED.length - 2];
      // Las lecturas de julio usaron otra muestra (chats más recientes de Evolution): no se
      // comparan con las de quincena. La historia empieza en la primera quincena medida.
      const resSerie = D.resolutionLatest ? [D.resolutionLatest.team.resolvedPct] : resolutionMonthly.months.map(k => resolutionMonthly.by_month[k].team.resolvedPct);
      const chSerie = C.corrida ? [CH.problemRate] : contractHandling.by_month.filter(m => m.contractConvs >= 40).map(m => m.problemRate);

      // tendencia contra el promedio de los puntos anteriores (hasta 3) de la misma serie:
      // una sola semana se mueve mucho por azar
      const vsPrevios = (serie, menosMejor, fmt, unidad) => {
        const v = serie.filter(x => x != null);
        if (v.length < 2) return null;
        const previos = v.slice(Math.max(0, v.length - 4), -1);
        const contra = previos.length > 1 ? `en promedio las ${previos.length} ${unidad} anteriores` : `la ${unidad.replace(/s$/, '')} anterior`;
        return tend(v[v.length - 1], prom(previos), menosMejor, fmt, contra + (unidad === 'quincenas' && previasParciales ? ' (sep: cobertura parcial)' : ''));
      };
      const tend = (act, ant, menosMejor, fmt, contra) => {
        if (act == null || ant == null) return null;
        const d = act - ant;
        // un cambio de menos de 10% (o de medio punto) es ruido: se dice "estable", sin color
        if (Math.abs(d) <= Math.max(0.5, Math.abs(ant) * 0.1)) return { txt: `Estable: ${fmt(ant)} ${contra}`, color: '#64748B' };
        const bien = menosMejor ? d < 0 : d > 0;
        return { txt: `${bien ? 'Mejora' : 'Empeora'}: ${d < 0 ? '↓' : '↑'} desde ${fmt(ant)} ${contra}`, color: bien ? '#1D9E75' : '#E8505B' };
      };

      // ── 1. Cómo vamos ───────────────────────────────────────────────────
      const filasEstado = [
        { tab: 'response', pregunta: '¿Le contestaron?', metrica: 'sin respuesta en más de 24 h', ref: REF.over24h,
          v: T?.over24hPct, valor: T ? `${T.over24hPct}%` : '—', serie: serieQ('over24hPct'),
          tend: vsPrevios(serieQ('over24hPct'), true, pct, 'quincenas'), dist: distancia(T?.over24hPct, REF.over24h, x => `${x} pts`),
          fuente: `Todas las conversaciones · ${Q ? Q.label : '4 semanas'}` + (enCurso ? ` · en curso (${enCurso.label}): ${enCurso.total.over24hPct}%` : '') + (llamadas && llamadas.total ? ` · llamadas perdidas ${Math.round(100 * llamadas.perdidas / llamadas.total)}%` : '') },
        { tab: 'response', pregunta: '¿Qué tan rápido?', metrica: 'primera respuesta (mediana, horario laboral)', ref: REF.primera,
          v: T?.medianMin, valor: T ? fmtMin(T.medianMin) : '—', serie: serieQ('medianMin'),
          tend: vsPrevios(serieQ('medianMin'), true, fmtMin, 'quincenas'),
          dist: T ? `${distancia(T.medianMin, REF.primera, fmtMin)} · el 10% más lento: ${fmtMin(T.p90Min)} (meta ${REF.p90.txt})` : null,
          refTxt: `${REF.primera.txt} · p90 ${REF.p90.txt}`,
          fuente: `Todas las conversaciones · ${Q ? Q.label : '4 semanas'}` + (enCurso ? ` · en curso (${enCurso.label}): ${fmtMin(enCurso.total.medianMin)}` : '') },
        { tab: 'resolution', pregunta: '¿Le resolvieron?', metrica: 'conversaciones resueltas', ref: REF.resueltas,
          v: R.team.resolvedPct, valor: `${R.team.resolvedPct}%`, serie: resSerie, viejo: viejo(R.fechaRef), periodo: R.periodo,
          tend: vsPrevios(resSerie, false, pct, 'mediciones'), dist: distancia(R.team.resolvedPct, REF.resueltas, x => `${x} pts`),
          fuente: `Muestra de ${R.team.total} conversaciones (máx. 18 por agente) · ${R.periodo}` },
        { tab: 'agents', pregunta: '¿Cómo se sintió?', metrica: 'con frustración moderada o severa', ref: REF.frust,
          v: frustAct, valor: `${frustAct}%`, serie: frustSerie, viejo: viejo(MED_ULT.fecha), periodo: MED_ULT.label.toLowerCase(),
          tend: vsPrevios(frustSerie, true, pct, 'mediciones'), dist: distancia(frustAct, REF.frust, x => `${x} pts`),
          fuente: `Muestra · ${MED_ULT.label.toLowerCase()} · ${MED_ULT.agentes} agentes` },
        { tab: 'contracts', pregunta: '¿Su contrato salió bien?', metrica: 'conversaciones de contrato con un problema', ref: REF.contratos,
          v: CH.problemRate, valor: `${CH.problemRate}%`, serie: chSerie, viejo: viejo(C.fechaRef), periodo: C.periodo,
          tend: vsPrevios(chSerie, true, pct, 'meses'), dist: distancia(CH.problemRate, REF.contratos, x => `${x} pts`),
          fuente: `${C.metodo && C.metodo.startsWith('Todos') ? 'Todos los' : 'Muestra de'} ${CH.contractConvs} cambios pedidos · ${C.periodo} · se recuperó el ${CH.recoveryPct}%` },
      ];

      // ── 2. Qué va bien / qué mejorar ────────────────────────────────────
      // Enfoque = dónde más impacto tiene un Lead: brokers afectados en la quincena × qué
      // tanto enoja lo que les pasó (lo que más enoja es lo que más riesgo de perderlos trae).
      // Un contrato que sale mal pesa más que esperar un día, y esperar un día más que esperar una hora.
      const GRAVEDAD = { contrato: 3, sinRespuesta: 2, lenta: 0.5 };
      const bien = [], mejorar = [];
      const conMuestra = AG.filter(a => a.threads >= RES_MIN_N);
      const fuera = (v, r) => v != null && (r.menosMejor ? v > r.tol : v < r.tol);   // fuera de la tolerancia
      // contratos: la corrida quincenal (contractLatest) cuando ya lo publique; mientras, la lectura puntual del 23 oct
      const CCR = C.corrida ? null : D.contractCasesRecent;
      if (C.corrida && CH.problems) {
        mejorar.push({ afectados: CH.problems, gravedad: GRAVEDAD.contrato, tab: 'contracts',
          titulo: `Cambios a contrato que no salen bien: ${CH.problemRate}% de los que se piden`,
          detalle: `${CH.problems} de ${CH.contractConvs} cambios pedidos en ${C.periodo} no se aplicaron, salieron a medias o mal, o tardaron y el broker tuvo que insistir; ${CH.problemsUnresolved ?? '—'} siguen sin quedar bien.`,
          responsable: 'Legal / contratos, con los Leads escalando',
          accion: 'Revisar con Legal en qué paso fallan los cambios y acordar una verificación antes de mandar la versión corregida.',
          exito: `En la siguiente corrida (${proximaCorrida}): contrato con problema bajando hacia la meta (${REF.contratos.txt}).` });
      }
      if (CCR) {
        const porQuincena = Math.round(CCR.fallas / (CCR.semanas / 2));
        const legal = CCR.dondeSeAtora.legal_contratos || 0, asesor = CCR.dondeSeAtora.asesor || 0;
        mejorar.push({ afectados: porQuincena, gravedad: GRAVEDAD.contrato, tab: 'contracts',
          titulo: `Cambios a contrato que no salen bien: ${Math.round(100 * CCR.fallas / CCR.cambios)}% de los que se piden`,
          detalle: `${CCR.fallas} de ${CCR.cambios} cambios en ${CCR.semanas} semanas no se aplicaron, salieron a medias o mal (~${porQuincena} brokers por quincena); ${CCR.siguenMal} siguen mal. Se atoran en Legal/contratos (${legal}) y con el asesor (${asesor}).`,
          responsable: 'Legal / contratos, con los Leads escalando',
          accion: 'Revisar con Legal los casos que siguen mal (Excel de casos) y acordar una verificación antes de mandar la versión corregida. Para los que se atoran con el asesor: confirmar con el broker que el cambio quedó.',
          exito: `En la corrida del ${proximaCorrida}: contrato con problema por debajo de ${CH.problemRate}% y bajando hacia la meta (${REF.contratos.txt}).` });
      }
      if (F) {
        const L = LQ;
        const tasa = (dias) => {
          const late = dias.reduce((s, d) => s + L.byWeekday[d], 0), abiertas = dias.reduce((s, d) => s + L.openedByWeekday[d], 0);
          return { late, abiertas, pct: abiertas ? Math.round(1000 * late / abiertas) / 10 : null };
        };
        const semana = tasa([0, 1, 2, 3, 4]), sab = tasa([5]);
        const Fr = L.franjas || {};
        const sum = (ks, c) => ks.reduce((s, k) => s + (Fr[k] ? Fr[k][c] : 0), 0);
        const FS = ['viernes_noche', 'sabado_antes', 'sabado_horario', 'sabado_despues', 'domingo'];
        const fsLate = sum(FS, 'late'), fsOpen = sum(FS, 'opened');
        const lv = Fr.lv_horario && Fr.lv_horario.opened ? Fr.lv_horario.late / Fr.lv_horario.opened : null;
        if (lv != null && fsOpen && fsLate / fsOpen >= 2 * lv && fsLate >= 10) {
          const sinFS = Math.round(1000 * (T.over24h - (fsLate - fsOpen * lv)) / T.threads) / 10;
          mejorar.push({ afectados: fsLate, gravedad: GRAVEDAD.sinRespuesta, tab: 'response',
            titulo: `Fin de semana: ${Math.round(100 * fsLate / fsOpen)}% espera más de 24 h (entre semana ${Math.round(1000 * lv) / 10}%)`,
            detalle: `${fsLate} de ${fsOpen} conversaciones que abren del viernes 19 h al domingo; ${Fr.sabado_horario ? Fr.sabado_horario.late : 0} son del sábado en horario (9–15 h). Casi todas se contestan hasta el lunes.`,
            responsable: 'CS Leads · guardia del sábado',
            accion: 'Que la guardia del sábado conteste ese mismo día lo que llega en horario y empiece por lo del viernes en la noche; no basta el mensaje automático.',
            exito: `Si el fin de semana se contestara como entre semana, sin respuesta >24 h bajaría de ${T.over24hPct}% a ~${sinFS}%.` });
        }
        if (semana.pct != null && semana.pct <= REF.over24h.atencion) {
          bien.push({ tab: 'response', titulo: `De lunes a viernes, ${(100 - semana.pct).toFixed(1)}% recibe respuesta en menos de 24 h`,
            detalle: `${semana.abiertas.toLocaleString('es-MX')} conversaciones` + (sab.pct >= 2 * semana.pct ? ' · lo que falta se concentra en el fin de semana.' : '.') });
        }
        // por agente: solo quien está FUERA de la tolerancia, no quien no es perfecto
        conMuestra.forEach(a => {
          const tarde = fuera(a.over24hPct, REF.over24h), lento = fuera(a.medianMin, REF.primera);
          if (!tarde && !lento) return;
          const lentas = Math.round(a.answered * (100 - (a.under60Pct || 0)) / 100);
          const afect = (tarde ? a.over24h : 0) + (lento ? lentas : 0);
          const sinEl = Math.round(1000 * (T.over24h - a.over24h + a.threads * REF.over24h.bien / 100) / T.threads) / 10;
          mejorar.push({ afectados: afect, peso: (tarde ? a.over24h * GRAVEDAD.sinRespuesta : 0) + (lento ? lentas * GRAVEDAD.lenta : 0), tab: 'feedback', quien: a.agent,
            titulo: tarde ? `${a.agent}: ${a.over24hPct}% sin respuesta más de 24 h` : `${a.agent}: primera respuesta de ${fmtMin(a.medianMin)}`,
            detalle: tarde
              ? `${a.over24h} de ${a.threads} conversaciones esperaron más de un día (el equipo está en ${T.over24hPct}%)` + (lento ? `; además ${lentas} esperaron más de 1 h hábil (mediana ${fmtMin(a.medianMin)})` : '')
              : `Contesta, pero tarde: ${lentas} brokers esperaron más de 1 h hábil; la mediana del equipo es ${fmtMin(T.medianMin)}.`,
            responsable: 'Su Lead',
            accion: tarde ? 'Revisar su carga y quién cubre su línea cuando no está; usar su feedback individual.' : 'Ver en Horarios en qué momento del día se le acumulan los mensajes.',
            exito: tarde ? `Con ${a.agent} en la meta, el equipo bajaría de ${T.over24hPct}% a ~${sinEl}% sin respuesta >24 h.` : `Su mediana abajo de ${fmtMin(REF.primera.tol)} la próxima quincena.` });
        });
        if (L.neverAnswered >= 20) mejorar.push({ afectados: L.neverAnswered, gravedad: GRAVEDAD.sinRespuesta, tab: 'response',
          titulo: `${L.neverAnswered} conversaciones nunca recibieron respuesta`,
          detalle: `Quincena ${Q ? Q.label : ''}. No cuenta respuestas automáticas, agradecimientos o despedidas, ni chats entre compañeras.`,
          responsable: 'Cada Lead con su equipo', accion: 'Revisar los chats sin contestar en WhatsApp.' });
        if (T.under60Pct >= 80) bien.push({ tab: 'response', titulo: `${T.under60Pct}% de las primeras respuestas llegan en menos de 1 h hábil`, detalle: `Mediana de ${fmtMin(T.medianMin)}.` });
        const estrellas = conMuestra.filter(a => a.over24hPct <= 1 && a.medianMin <= 10);
        if (estrellas.length) bien.push({ tab: 'feedback',
          titulo: `Reconocer: ${estrellas.map(a => a.agent).join(', ')}`,
          detalle: 'Contestan casi todo (≤1% sin respuesta >24 h) y rápido (mediana de 10 min o menos).',
          accion: 'Mencionarlos en la junta con el dato y pedirles compartir cómo organizan su bandeja.' });
      }
      if (!viejo(MED_ULT.fecha) && frustSerie.length > 1) {
        if (frustAct <= Math.min(...frustSerie.slice(0, -1))) bien.push({ tab: 'agents', titulo: `Frustración en su nivel más bajo: ${frustAct}%`, detalle: `Empezó en ${frustSerie[0]}% (${MED_1RA.label.toLowerCase()}).` });
        else if (frustAct > frustSerie[frustSerie.length - 2] + 2) mejorar.push({ afectados: 10, gravedad: 2, tab: 'agents', titulo: `La frustración subió a ${frustAct}%`, detalle: `Era ${frustSerie[frustSerie.length - 2]}% el ${MED_ANT.label.toLowerCase()}.`, accion: 'Ver las causas en Insights y Mejoras.' });
      }
      if (nivel(R.team.resolvedPct, REF.resueltas) === 'bien' && !viejo(R.fechaRef)) bien.push({ tab: 'resolution', titulo: `${R.team.resolvedPct}% de las conversaciones se resuelve`, detalle: `Muestra de ${R.team.total} · ${R.periodo}.` });
      mejorar.forEach(m => { if (m.peso == null) m.peso = m.afectados * m.gravedad; });
      mejorar.sort((a, b) => b.peso - a.peso);
      const enfoque = mejorar.slice(0, 3), otros = mejorar.slice(3);

      // ── 3. tabla por agente (padrón = activos en la quincena del Resumen) ──
      const idx = (arr, k = 'agent') => Object.fromEntries((arr || []).map(a => [a[k], a]));
      const fr = idx(AG), rs = idx(R.agents), chA = idx(C.agents);
      const fn = idx(D.frustrationLatest && D.frustrationLatest.key === MED_ULT.key ? D.frustrationLatest.agents : null);
      const frustDe = Object.fromEntries(agentRanking.map(a => [a.name, a[MED_ULT.key]]));
      const nombres = AG.length ? AG.map(a => a.agent) : [...new Set(agentRanking.map(a => a.name))];
      const filas = nombres.map(n => ({
        agent: n,
        threads: fr[n]?.threads ?? null,
        over24hPct: fr[n]?.over24hPct ?? null,
        medianMin: fr[n]?.medianMin ?? null,
        resolvedPct: rs[n]?.resolvedPct ?? null, resN: rs[n]?.total ?? null,
        frust: frustDe[n] ?? null, frustN: fn[n]?.n ?? null,
        problemRate: chA[n]?.problemRate ?? null, chN: chA[n]?.contractConvs ?? null,
      }));
      const mayorPeor = { over24hPct: true, medianMin: true, resolvedPct: false, frust: true, problemRate: true };
      filas.sort((a, b) => {
        const va = a[orden], vb = b[orden];
        if (va == null) return 1; if (vb == null) return -1;
        return mayorPeor[orden] ? vb - va : va - vb;
      });
      // verde = cumple la meta · sin color = dentro de la tolerancia · rojo = fuera de la tolerancia
      const colorNivel = (v, r) => v == null ? '#CBD5E1' : nivel(v, r) === 'bien' ? '#1D9E75' : fuera(v, r) ? '#E8505B' : '#334155';
      const Celda = ({ v, txt, r, n, gris }) => {
        const debil = gris || (n != null && n < RES_MIN_N);
        return (
          <td className="py-2.5 px-3 text-right tabular-nums whitespace-nowrap">
            <span className="text-sm font-semibold" style={{ color: v == null ? '#CBD5E1' : debil ? '#94A3B8' : colorNivel(v, r) }}>{v == null ? '—' : txt}</span>
            {v != null && n != null && <span className="text-[10px] text-gray-400 ml-1">n={n}</span>}

        );
      };
      const Th = ({ k, children, sub }) => (
        <th onClick={k ? () => setOrden(k) : undefined}

      const resViejo = viejo(R.fechaRef), chViejo = viejo(C.fechaRef);
      const pocos = (a) => a.threads != null && a.threads < RES_MIN_N;
      // lo que ya logra el mejor 25% de los agentes, para explicar las metas con el dato de hoy
      const q25 = (k) => { const v = conMuestra.map(a => a[k]).filter(x => x != null).sort((a, b) => a - b); return v.length ? v[Math.floor((v.length - 1) * 0.25)] : null; };

        ['Sin respuesta >24 h', REF.over24h.txt, `El mejor 25% de los agentes ya está en ${q25('over24hPct') === 0 ? '0%' : `${q25('over24hPct') ?? '—'}% o menos`}, y de lunes a viernes el equipo completo ronda el 2%. El problema está concentrado en el fin de semana, así que es alcanzable.`],

                          {f.dist && <div className="font-semibold text-navy-dark">{f.dist}</div>}

          {/* por qué estas metas */}

              <strong className="text-gray-700">Cómo leerlo:</strong> la distancia a la meta dice <strong>dónde estamos</strong>; la tendencia, <strong>hacia dónde vamos</strong>.
              Se puede ir mejorando y todavía no llegar. Un cambio de menos de 10% contra el promedio anterior se marca como <em>estable</em>.

            <p className="mt-2 text-gray-500">
              <strong className="text-gray-700">Tolerancia por agente:</strong> somos humanos y no todos tienen que estar en la meta. Un agente solo se señala

          </div>
          <div className="space-y-3 mb-8">
            {enfoque.length ? enfoque.map((h, i) => (
              <button key={i} onClick={() => onJump && onJump(h.tab)}
                className="w-full text-left bg-white border border-gray-200 rounded-xl px-4 sm:px-5 py-4 hover:border-navy-dark/30 transition-colors grid grid-cols-[28px_1fr] gap-x-3">
                <span className="text-2xl font-extrabold text-coral leading-none">{i + 1}</span>
                <div className="min-w-0">
                  <div className="flex items-baseline justify-between gap-3 flex-wrap">
                    <span className="text-base font-bold text-navy-dark">{h.titulo}</span>
                    <span className="text-xs font-semibold text-gray-500 whitespace-nowrap">~{h.afectados} brokers afectados</span>
                  </div>
                  <div className="text-sm text-gray-600 mt-1">{h.detalle}</div>
                  <div className="grid sm:grid-cols-3 gap-x-5 gap-y-1.5 mt-3 text-xs">
                    {h.responsable && <div><div className="text-gray-400 font-semibold uppercase tracking-wide text-[10px]">Responsable</div><div className="text-navy-dark">{h.responsable}</div></div>}
                    {h.accion && <div className="sm:col-span-1"><div className="text-gray-400 font-semibold uppercase tracking-wide text-[10px]">Qué hacer</div><div className="text-navy-dark">{h.accion}</div></div>}
                    {h.exito && <div><div className="text-gray-400 font-semibold uppercase tracking-wide text-[10px]">Cómo sabremos si funcionó</div><div className="text-navy-dark">{h.exito}</div></div>}
                  </div>

              </button>
            )) : <p className="bg-white border border-gray-200 rounded-xl px-4 py-4 text-sm text-gray-500">Nada fuera de tolerancia en esta quincena.</p>}
          </div>

          {/* 3 · Otros y qué va bien */}
          <div className="grid grid-cols-1 lg:grid-cols-5 gap-5 mb-10">
            <div className="lg:col-span-3">
              <h3 className="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">3 · También a revisar</h3>
              <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">

              </div>
            </div>
            <div className="lg:col-span-2">
              <h3 className="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">4 · Qué va bien</h3>
              <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                {bien.length ? bien.slice(0, 5).map((h, i) => <Hallazgo key={i} h={h} tono="#1D9E75" />)
                  : <p className="px-4 py-4 text-sm text-gray-500">Sin señales destacadas en este periodo.</p>}
              </div>
            </div>
          </div>

          {/* 5 · Por agente */}
          <div className="flex items-baseline justify-between flex-wrap gap-2 mb-3">
            <h3 className="text-xs font-semibold uppercase tracking-widest text-gray-400">5 · Por agente</h3>
            <button onClick={() => onJump && onJump('feedback')} className="text-xs font-semibold text-teal hover:underline">Feedback individual por agente →</button>
          </div>
          <div className="bg-white border border-gray-200 rounded-xl p-4 sm:p-5">
            <div className="overflow-x-auto -mx-1">
              <table className="w-full min-w-[820px]">
                <thead>
                  <tr className="border-b border-gray-200">
                    <th className="py-2 px-3 text-left text-xs font-semibold text-gray-400 align-bottom">Agente</th>
                    <Th sub={Q ? Q.label : '4 sem'}>Convs.</Th>

                    <Th k="resolvedPct" sub={R.periodo}>3 · Resueltas</Th>
                    <Th k="frust" sub={MED_ULT.label.toLowerCase()}>4 · Frustración</Th>
                    <Th k="problemRate" sub={C.periodo}>5 · Contrato c/ problema</Th>
                  </tr>
                </thead>
                <tbody>
                  {filas.map(r => (
                    <tr key={r.agent} className="border-b border-gray-100 last:border-0">
                      <td className="py-2.5 px-3 text-sm font-medium text-navy-dark whitespace-nowrap">{r.agent}</td>
                      <td className="py-2.5 px-3 text-right text-sm text-gray-500 tabular-nums">{r.threads ?? '—'}</td>
                      <Celda v={r.over24hPct} txt={`${r.over24hPct}%`} r={REF.over24h} n={null} gris={pocos(r)} />
                      <Celda v={r.medianMin} txt={fmtMin(r.medianMin)} r={REF.primera} n={null} gris={pocos(r)} />
                      <Celda v={r.resolvedPct} txt={`${r.resolvedPct}%`} r={REF.resueltas} n={r.resN} gris={resViejo} />
                      <Celda v={r.frust} txt={`${r.frust}%`} r={REF.frust} n={r.frustN} gris={viejo(MED_ULT.fecha)} />
                      <Celda v={r.problemRate} txt={`${r.problemRate}%`} r={REF.contratos} n={r.chN} gris={chViejo} />
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-4 text-xs text-gray-500 space-y-1">
              <p>Clic en una columna para ordenar. Agentes activos en la quincena {Q ? Q.label : ''}. Verde = cumple la meta; sin color = dentro de la tolerancia; rojo = fuera de la tolerancia.</p>
              <p><span className="text-gray-400 font-semibold">En gris</span>: menos de {RES_MIN_N} conversaciones o dato anterior a {DIAS_VIEJO} días. Úsalo como pista, no para comparar agentes.</p>
              <p>1–2 se calculan sobre todas las conversaciones; 3–5 salen de una muestra que lee la IA cada quincena.</p>
            </div>
          </div>
        </Section>
      );
    }

    function DonutChart({ data, size = 200, thickness = 28 }) {
      const radius = (size - thickness) / 2;
      const circumference = 2 * Math.PI * radius;
      const center = size / 2;
      let cumOffset = 0;

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          {data.map((d, i) => {
            const dashLen = (d.pct / 100) * circumference;
            const offset = cumOffset;
            cumOffset += dashLen;
            return (
              <circle
                key={i} cx={center} cy={center} r={radius}
                fill="none" stroke={d.color} strokeWidth={thickness}
                strokeDasharray={`${dashLen} ${circumference - dashLen}`}
                strokeDashoffset={-offset}
                transform={`rotate(-90 ${center} ${center})`}
                className="donut-segment"
                style={{'--circumference': circumference, animationDelay: `${i * 0.15}s`}}
              />
            );
          })}
          <text x={center} y={center - 8} textAnchor="middle" fontSize="36" fontWeight="800" fill="#E8505B" dominantBaseline="middle">41%</text>
          <text x={center} y={center + 20} textAnchor="middle" fontSize="12" fill="#94A3B8">frustración</text>
        </svg>
      );
    }
