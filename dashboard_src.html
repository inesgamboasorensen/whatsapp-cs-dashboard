    function ResolutionSection() {
      const [scope, setScope] = React.useState(resolutionMonthly.months[resolutionMonthly.months.length - 1]);
      const [order, setOrder] = React.useState('red'); // red (más sin resolver) | resolved
      const monthName = (k) => { const [y, m] = k.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month: 'short', year: 'numeric' }); };
      const scopeOpts = [{ k: 'all', l: 'Todos' }, ...resolutionMonthly.months.slice().reverse().map(k => ({ k, l: monthName(k) }))];
      const scopeData = scope === 'all' ? resolutionMonthly.all : resolutionMonthly.by_month[scope];
      const sorted = [...scopeData.agents].sort((a, b) => order === 'red' ? b.unresolvedPct - a.unresolvedPct : b.resolvedPct - a.resolvedPct);
      const team = scopeData.team;
      const teamResolved = team.resolvedPct;
      const teamEsc = team.escalationPct;
      const colorRes = (p) => p >= 65 ? '#2EC4B6' : p >= 50 ? '#22C55E' : p >= 35 ? '#F97316' : '#E8505B';
      const colorRed = (p) => p >= 30 ? '#E8505B' : p >= 15 ? '#F97316' : '#22C55E';
      // --- RED (sin resolver) focus: average & median across agents, tracked by month ---
      const mean = (a) => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length) : 0;
      const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), n = s.length; return Math.round(n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2); };
      const redVals = scopeData.agents.map(a => a.unresolvedPct);
      const avgRed = mean(redVals), medRed = median(redVals);
      const redByMonth = resolutionMonthly.months.map(m => {
        const vals = resolutionMonthly.by_month[m].agents.map(a => a.unresolvedPct);
        return { m, label: monthName(m), avg: mean(vals), med: median(vals), teamRed: resolutionMonthly.by_month[m].team.unresolvedPct };
      });
      // May per-agent volume is thin (the pull is recency-biased); flag it.
      const thinPerAgent = scope === '2026-05';

      return (
        <Section title="Efectividad de Resolución" id="resolution">
          {D.resolutionLatest
            ? <p className="text-sm text-gray-600 mb-4">Última corrida ({fechaCorta(D.resolutionLatest.fecha)}): <strong>{D.resolutionLatest.team.resolvedPct}% resueltas</strong> de {D.resolutionLatest.team.total} conversaciones. El detalle por mes de abajo es del análisis anterior.</p>
            : <AvisoViejo periodo={mesLargo(resolutionMonthly.months[resolutionMonthly.months.length - 1])} que="Las corridas automáticas clasifican la resolución pero hasta ahora no la publicaban."
                detalle="Desde la próxima corrida quincenal el Resumen muestra el dato nuevo." />}
          {/* Month filter */}
          <div className="flex flex-wrap items-center gap-3 mb-4">
            <span className="text-xs text-gray-500 uppercase tracking-wide">Periodo:</span>
            <div className="inline-flex bg-white border border-gray-200 rounded-lg p-1 gap-1 shadow-sm">
              {scopeOpts.map(o => (
                <button key={o.k} onClick={() => setScope(o.k)}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-colors ${scope === o.k ? 'bg-navy-dark text-white' : 'text-gray-500 hover:text-navy-dark'}`}>
                  {o.l}
                </button>
              ))}
            </div>
            <span className="text-xs text-gray-400">{team.total} conversaciones · {sorted.length} agentes</span>
          </div>
          <div className="bg-white rounded-xl p-4 mb-6 border border-navy/10">
            <p className="text-xs text-gray-600">
              🎯 Mide si el agente realmente resolvió el problema del broker. Cada conversación la clasifica Claude leyéndola (no son todas las conversaciones, es una muestra: <strong>~18 por agente en junio</strong>). El filtro mensual se irá llenando corrida con corrida.
            </p>
            {thinPerAgent && (
              <p className="text-xs text-orange-600 mt-2">⚠️ Mayo es confiable a nivel equipo, pero por-agente la muestra es chica (la descarga prioriza conversaciones recientes). Junio es el mes sólido por agente.</p>
            )}
          </div>

          {/* RED FOCUS — sin resolver, individual y como grupo, en el tiempo */}
          <div className="bg-white rounded-xl p-5 mb-6 shadow-sm" style={{ borderLeft: '4px solid #E8505B' }}>
            <div className="flex items-start justify-between flex-wrap gap-4">
              <div className="max-w-md">
                <p className="text-sm font-bold text-navy-dark mb-0.5">🔴 Sin resolver al final (rojo) — el indicador a vigilar</p>
                <p className="text-xs text-gray-500">El amarillo (sin señal clara) es ambiguo, así que el foco es el <strong>rojo</strong>: conversaciones que terminaron sin resolverse. La meta es bajarlo.</p>
              </div>
              <div className="flex gap-6">
                <div className="text-center"><div className="text-4xl font-extrabold" style={{ color: '#E8505B' }}>{avgRed}%</div><div className="text-[11px] text-gray-500 uppercase tracking-wide">Promedio equipo</div></div>
                <div className="text-center"><div className="text-4xl font-extrabold" style={{ color: '#E8505B' }}>{medRed}%</div><div className="text-[11px] text-gray-500 uppercase tracking-wide">Mediana</div></div>
              </div>
            </div>
            <div className="mt-4 pt-3 border-t border-gray-100">
              <span className="text-[11px] text-gray-500 uppercase tracking-wide">% sin resolver por mes (promedio · mediana del equipo)</span>
              <div className="flex items-center gap-2 mt-2 flex-wrap">
                {redByMonth.map((r, i) => (
                  <React.Fragment key={r.m}>
                    {i > 0 && <span className="text-gray-300">→</span>}
                    <span className="inline-flex items-baseline gap-1.5 bg-red-50 rounded-lg px-3 py-1.5" style={{ background: '#FEF2F2' }}>
                      <span className="text-xs text-gray-500">{r.label}</span>
                      <span className="text-base font-bold" style={{ color: '#E8505B' }}>{r.avg}%</span>
                      <span className="text-[11px] text-gray-400">méd {r.med}%</span>
                    </span>
                  </React.Fragment>
                ))}
                <span className="text-[11px] text-gray-400">· se va llenando cada corrida</span>
              </div>
            </div>
          </div>

          {/* Top KPIs */}
          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #2EC4B6'}}>
              <div className="text-3xl mb-1">✅</div>
              <div className="text-3xl font-extrabold text-teal">{teamResolved}%</div>
              <div className="text-xs text-gray-500 mt-1">Resolución promedio del equipo</div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #1B2A4A'}}>
              <div className="text-3xl mb-1">⭐</div>
              <div className="text-2xl font-extrabold text-navy-dark">{sorted[0].agent}</div>
              <div className="text-xs text-gray-500 mt-1">Mejor resolución · {sorted[0].resolvedPct}%</div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #F97316'}}>
              <div className="text-3xl mb-1">💬</div>
              <div className="text-3xl font-extrabold text-orange-500">{team.total}</div>
              <div className="text-xs text-gray-500 mt-1">Conversaciones analizadas ({scope === 'all' ? 'todos los meses' : monthName(scope)})</div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #E8505B'}}>
              <div className="text-3xl mb-1">↗️</div>
              <div className="text-3xl font-extrabold text-coral">{teamEsc}%</div>
              <div className="text-xs text-gray-500 mt-1">Conversaciones que requirieron otro equipo</div>
            </div>
          </div>

          {/* Per-agent resolution bars */}
          <div className="bg-white rounded-xl p-6 shadow-sm mb-6">
            <div className="flex items-center justify-between flex-wrap gap-3 mb-1">
              <h3 className="font-bold text-navy-dark">Distribución de Resolución por Agente</h3>
              <div className="inline-flex bg-gray-100 rounded-lg p-1 gap-1">
                <button onClick={() => setOrder('red')} className={`px-3 py-1 text-xs font-semibold rounded-md transition-colors ${order === 'red' ? 'bg-white shadow-sm text-coral' : 'text-gray-500'}`}>Más sin resolver</button>
                <button onClick={() => setOrder('resolved')} className={`px-3 py-1 text-xs font-semibold rounded-md transition-colors ${order === 'resolved' ? 'bg-white shadow-sm text-navy-dark' : 'text-gray-500'}`}>Mejor resolución</button>
              </div>
            </div>
            <p className="text-xs text-gray-500 mb-5"><span style={{color:'#2EC4B6'}}>■</span> resuelto · <span style={{color:'#FACC15'}}>■</span> sin señal clara (ambiguo) · <span style={{color:'#E8505B', fontWeight:600}}>■ sin resolver</span> ← lo importante</p>
            <div className="space-y-4">
              {sorted.map((r, i) => (
                <div key={i}>
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-sm font-medium text-navy-dark">
                      {r.agent}
                      <span className="ml-2 text-xs text-gray-400 font-normal">({r.total} convs)</span>
                    </span>
                    <span className="text-sm font-bold" style={{color: '#E8505B'}}>{r.unresolvedPct}% sin resolver</span>
                  </div>
                  <div className="w-full bg-gray-100 rounded-full h-5 overflow-hidden flex">
                    <div className="h-5 flex items-center justify-end pr-2" style={{width: `${r.resolvedPct}%`, backgroundColor: '#2EC4B6'}}>
                      <span className="text-white text-xs font-bold">{r.resolvedPct}%</span>
                    </div>
                    <div className="h-5 flex items-center justify-center" style={{width: `${r.unclearPct}%`, backgroundColor: '#FACC15'}}>
                      {r.unclearPct >= 10 && <span className="text-white text-xs font-bold">{r.unclearPct}%</span>}
                    </div>
                    {r.unresolvedPct > 0 && (
                      <div className="h-5 flex items-center justify-center" style={{width: `${r.unresolvedPct}%`, backgroundColor: '#E8505B'}}>
                        {r.unresolvedPct >= 10 && <span className="text-white text-xs font-bold">{r.unresolvedPct}%</span>}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-4 flex gap-4 text-xs flex-wrap">
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-teal"></span><span className="text-gray-600">Resuelto (broker terminó con "gracias", "perfecto", "listo")</span></span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm" style={{background: '#FACC15'}}></span><span className="text-gray-600">Sin señal clara</span></span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-coral"></span><span className="text-gray-600">Sin resolver ("sigue fallando", "todavía no")</span></span>
            </div>
          </div>

          {/* Detail table */}
          <div className="bg-white rounded-xl shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[640px]">
                <thead>
                  <tr className="bg-navy-dark text-white">
                    <th className="py-3 px-4 text-left text-xs font-semibold">Agente</th>
                    <th className="py-3 px-4 text-center text-xs font-semibold">Convs</th>
                    <th className="py-3 px-4 text-center text-xs font-semibold">% Resueltas</th>
                    <th className="py-3 px-4 text-center text-xs font-semibold bg-coral/20">% Sin resolver</th>
                    <th className="py-3 px-4 text-center text-xs font-semibold">Mensajes prom.</th>
                    <th className="py-3 px-4 text-center text-xs font-semibold">% Necesitó otro equipo</th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((r, i) => (
                    <tr key={i} className={`border-b border-gray-100 ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                      <td className="py-3 px-4 text-sm font-medium text-navy-dark">{r.agent}</td>
                      <td className="py-3 px-4 text-center text-sm text-gray-500">{r.total}</td>
                      <td className="py-3 px-4 text-center text-sm font-bold" style={{color: colorRes(r.resolvedPct)}}>{r.resolvedPct}%</td>
                      <td className="py-3 px-4 text-center text-sm font-bold bg-coral/5" style={{color: colorRed(r.unresolvedPct)}}>{r.unresolvedPct}%</td>
                      <td className="py-3 px-4 text-center text-sm text-gray-700">{r.avgMsgs}</td>
                      <td className="py-3 px-4 text-center text-sm" style={{color: r.escalationPct > 40 ? '#E8505B' : r.escalationPct > 20 ? '#F97316' : '#22C55E'}}>{r.escalationPct}%</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Methodology */}
          <div className="mt-6 bg-navy-dark rounded-xl p-5">
            <p className="text-teal text-sm font-bold mb-2">¿Cómo se mide la resolución?</p>
            <div className="text-gray-300 text-xs leading-relaxed space-y-1.5">
              <p><strong className="text-white">Resuelto:</strong> el broker termina la conversación con señales positivas claras ("gracias", "perfecto", "listo", "ya quedó").</p>
              <p><strong className="text-white">Sin resolver:</strong> el broker termina con señales de frustración o problema persistente ("sigue fallando", "todavía no", "me sigue saliendo el error").</p>
              <p><strong className="text-white">Sin señal clara:</strong> la conversación termina sin un cierre evidente — el broker dejó de responder o el último mensaje es neutral.</p>
              <p><strong className="text-white">Necesitó otro equipo:</strong> el agente mencionó al área legal, tech, contratos, pagos o investigación durante la conversación. Alto % no es malo en sí — refleja casos complejos que requieren coordinación interna.</p>
              <p className="pt-1 text-gray-400">Mensajes y duración promedio son señales adicionales: muchos mensajes + larga duración pueden indicar conversaciones difíciles, no necesariamente mal manejo.</p>
            </div>
          </div>
        </Section>
      );
    }

    function MetricMonthlyTrend({ field, unit, label, dark, lowerBetter }) {
      const mm = (typeof metricsMonthly !== 'undefined' && metricsMonthly) || [];
      if (mm.length < 2) return null;
      const mn = (k) => new Date(k + '-01T00:00:00').toLocaleDateString('es-MX', { month: 'short', year: 'numeric' });
      const last = mm[mm.length - 1][field], prev = mm[mm.length - 2][field];
      const improved = lowerBetter ? last < prev : last > prev;
      return (
        <div className="rounded-xl p-5 mb-6" style={{ background: dark ? '#1B2A4A' : '#FFFFFF', borderLeft: '4px solid #2EC4B6', boxShadow: dark ? 'none' : '0 1px 3px rgba(0,0,0,0.06)' }}>
          <p className="text-sm font-bold mb-0.5" style={{ color: dark ? '#FFFFFF' : '#1B2A4A' }}>Tendencia por mes (equipo)</p>
          <p className="text-xs mb-3" style={{ color: dark ? '#94A3B8' : '#6B7280' }}>{label} por mes. Se va llenando cada corrida.</p>
          <div className="flex items-center gap-2 flex-wrap">
            {mm.map((m, i) => (
              <React.Fragment key={m.month}>
                {i > 0 && <span style={{ color: '#94A3B8' }}>→</span>}
                <div className="rounded-lg px-3 py-2" style={{ background: dark ? 'rgba(255,255,255,0.06)' : '#F8FAFC', border: dark ? '1px solid rgba(255,255,255,0.1)' : '1px solid #E2E8F0' }}>
                  <div className="text-[11px]" style={{ color: dark ? '#94A3B8' : '#6B7280' }}>{mn(m.month)}</div>
                  <div className="text-sm font-bold" style={{ color: (i === mm.length - 1) ? (improved ? '#1D9E75' : '#E8505B') : (dark ? '#E5E7EB' : '#1B2A4A') }}>{m[field]}{unit}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    function WritingQualitySection() {
      // Convert internal "errors score" (lower is better) to "calificación 0-100" (higher is better)
      const toGrade = (s) => Math.max(0, Math.min(100, Math.round(100 - s * 1.2)));
      const sorted = [...writingQuality].map(r => ({...r, grade: toGrade(r.score)})).sort((a, b) => b.grade - a.grade);
      const teamAvgTypos = (sorted.reduce((s, r) => s + r.typos, 0) / sorted.length).toFixed(1);
      const teamAvgAccents = (sorted.reduce((s, r) => s + r.missingAccents, 0) / sorted.length).toFixed(1);
      const teamAvgGrade = Math.round(sorted.reduce((s, r) => s + r.grade, 0) / sorted.length);
      const colorForGrade = (g) => g >= 85 ? '#2EC4B6' : g >= 70 ? '#22C55E' : g >= 55 ? '#F97316' : '#E8505B';
      const labelForGrade = (g) => g >= 85 ? 'Excelente' : g >= 70 ? 'Bueno' : g >= 55 ? 'Aceptable' : 'A mejorar';

      return (
        <Section title="Calidad de Escritura y Profesionalismo" id="writing">
          <MetricMonthlyTrend field="writing_grade" unit="/100" label="Calidad de escritura (0–100, más alto = mejor)" lowerBetter={false} />
          <div className="bg-white rounded-xl p-4 mb-6 border border-navy/10">
            <p className="text-xs text-gray-600">
              ✍️ Calificación de 0 a 100 (mayor = mejor) basada en análisis automático de gramática, ortografía y tono ·
              {sorted.reduce((s, r) => s + r.msgs, 0).toLocaleString()} mensajes analizados ·
              Métricas: typos · acentos · ALL CAPS · emojis · capitalización
            </p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #2EC4B6'}}>
              <div className="text-3xl mb-1">⭐</div>
              <div className="text-2xl font-extrabold text-teal">{sorted[0].agent}</div>
              <div className="text-xs text-gray-500 mt-1">Mejor escritura · <span className="font-bold">{sorted[0].grade}/100</span></div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #F97316'}}>
              <div className="text-3xl mb-1">📊</div>
              <div className="text-2xl font-extrabold text-orange-500">{teamAvgGrade}/100</div>
              <div className="text-xs text-gray-500 mt-1">Calificación promedio del equipo</div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #E8505B'}}>
              <div className="text-3xl mb-1">📝</div>
              <div className="text-2xl font-extrabold text-coral">{teamAvgTypos}</div>
              <div className="text-xs text-gray-500 mt-1">Typos por 100 mensajes (promedio)</div>
            </div>
          </div>

          {/* Per-agent detail cards */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            {sorted.map((r, i) => (
              <div key={i} className="bg-white rounded-xl p-6 shadow-sm" style={{borderTop: `4px solid ${colorForGrade(r.grade)}`}}>
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <h3 className="text-lg font-bold text-navy-dark flex items-center gap-2">
                      {r.agent}
                      {r.isNew && <span className="text-xs text-teal bg-teal/10 px-2 py-0.5 rounded-full font-semibold">NUEVO</span>}
                    </h3>
                    <p className="text-xs text-gray-500">{r.msgs.toLocaleString()} mensajes · {r.avgLen} chars promedio</p>
                  </div>
                  <div className="text-right">
                    <div className="text-2xl font-extrabold leading-none" style={{color: colorForGrade(r.grade)}}>{r.grade}<span className="text-xs text-gray-400 font-normal">/100</span></div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full mt-1 inline-block" style={{color: colorForGrade(r.grade), backgroundColor: colorForGrade(r.grade) + '20'}}>{labelForGrade(r.grade)}</span>
                  </div>
                </div>
                {/* Metrics grid */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
                  <div className="text-center p-2 bg-gray-50 rounded">
                    <div className="text-lg font-bold" style={{color: r.typos > 2 ? '#E8505B' : r.typos > 0.5 ? '#F97316' : '#2EC4B6'}}>{r.typos}</div>
                    <div className="text-[10px] text-gray-500 uppercase">Typos/100</div>
                  </div>
                  <div className="text-center p-2 bg-gray-50 rounded">
                    <div className="text-lg font-bold" style={{color: r.missingAccents > 8 ? '#E8505B' : r.missingAccents > 4 ? '#F97316' : '#2EC4B6'}}>{r.missingAccents}%</div>
                    <div className="text-[10px] text-gray-500 uppercase">Sin acento</div>
                  </div>
                  <div className="text-center p-2 bg-gray-50 rounded">
                    <div className="text-lg font-bold" style={{color: r.lowerStart > 20 ? '#E8505B' : r.lowerStart > 10 ? '#F97316' : '#2EC4B6'}}>{r.lowerStart}%</div>
                    <div className="text-[10px] text-gray-500 uppercase">Inicio min</div>
                  </div>
                  <div className="text-center p-2 bg-gray-50 rounded">
                    <div className="text-lg font-bold" style={{color: r.emojiPerMsg > 0.5 ? '#E8505B' : '#2EC4B6'}}>{r.emojiPerMsg}</div>
                    <div className="text-[10px] text-gray-500 uppercase">Emoji/msg</div>
                  </div>
                </div>
                {/* Examples */}
                {r.examples.bad.length > 0 && (
                  <div className="bg-coral/5 border border-coral/20 rounded-lg p-3 mb-2">
                    <p className="text-xs font-semibold text-coral mb-1.5">A mejorar:</p>
                    <ul className="text-xs text-gray-700 space-y-1">
                      {r.examples.bad.map((e, j) => <li key={j} className="leading-snug">• {e}</li>)}
                    </ul>
                  </div>
                )}
                {r.examples.good.length > 0 && (
                  <div className="bg-teal/5 border border-teal/20 rounded-lg p-3">
                    <p className="text-xs font-semibold text-teal mb-1.5">Bien hecho:</p>
                    <ul className="text-xs text-gray-700 space-y-1">
                      {r.examples.good.map((e, j) => <li key={j} className="leading-snug">• {e}</li>)}
                    </ul>
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Methodology */}
          <div className="mt-8 bg-navy-dark rounded-xl p-5">
            <p className="text-teal text-sm font-bold mb-2">¿Cómo se calcula la calificación?</p>
            <div className="text-gray-300 text-xs leading-relaxed space-y-1">
              <p><strong className="text-white">Calificación = 100 − (errores ponderados × 1.2)</strong>, escala 0-100 donde 100 = perfecto.</p>
              <p>Ponderaciones del cálculo de errores: typos (×3) + sin acentos (×1) + ALL CAPS (×0.5) + inicio con minúscula (×0.3) + emojis excesivos (×5 si {'>'} 0.5/msg).</p>
              <p>Excluye nombres propios en mayúsculas (ej. "ISABEL GONZÁLEZ") y URLs. Solo considera mensajes del agente.</p>

    // Minutos hábiles → texto corto (8 h hábiles = 1 día)

    // Primera respuesta y conversaciones sin respuesta >24 h — últimas 4 semanas.

    function FirstResponseSection() {

              <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Primera respuesta · mediana</div>

              <div className="text-gray-500 text-xs mt-1">{T.under60Pct}% antes de 1 h hábil · 1 de cada 10 tarda más de {fmtMin(T.p90Min)}</div>
            </div>

              <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Sin respuesta en 24 h</div>

              <div className="text-gray-500 text-xs mt-1">{T.over24h.toLocaleString('es-MX')} de {T.threads.toLocaleString('es-MX')} conversaciones · {T.threads - T.answered} nunca respondidas</div>
            </div>

              <div className="text-gray-400 text-xs uppercase tracking-wide mb-2">Sin respuesta en 24 h · por semana</div>

          <div className="bg-white rounded-xl p-6 sm:p-8 shadow-sm">

              <p>Las semanas más viejas tienen menos conversaciones ({T.weeks.map(w => w.n).join(' · ')}): antes del tiempo real solo se guardaban los chats más recientes de cada agente.</p>

    // Calls section — fetches live from Cloudflare Worker, auto-refreshes every 30s
    function CallsSection() {
      const [calls, setCalls] = React.useState(null);
      const [error, setError] = React.useState(null);
      const [lastUpdated, setLastUpdated] = React.useState(null);
      const [refreshing, setRefreshing] = React.useState(false);
      const [windowMode, setWindowMode] = React.useState('daily'); // 'daily' | 'weekly' | 'monthly'

      const fetchCalls = React.useCallback(() => {
        setRefreshing(true);
        fetch('https://delicate-poetry-a88a.ines-25d.workers.dev/whatsapp-calls', { cache: 'no-store' })
          .then(r => r.json())
          .then(d => {
            setCalls(d);
            setLastUpdated(new Date());
            setError(null);
          })
          .catch(e => setError(e.message))
          .finally(() => setRefreshing(false));
      }, []);

      React.useEffect(() => {
        fetchCalls();
        const interval = setInterval(fetchCalls, 30000); // 30s auto-refresh
        return () => clearInterval(interval);
      }, [fetchCalls]);

      if (error) {
        return (
          <Section title="Llamadas WhatsApp" id="calls">
            <div className="bg-white rounded-xl p-8 text-center">
              <p className="text-gray-500 text-sm">No se pudieron cargar las llamadas: {error}</p>
            </div>
          </Section>
        );
      }
      if (calls === null) {
        return (
          <Section title="Llamadas WhatsApp" id="calls">
            <div className="bg-white rounded-xl p-8 text-center">
              <p className="text-gray-500 text-sm">Cargando datos de llamadas...</p>
            </div>
          </Section>
        );
      }

      // Compute metrics
      const cleanInstance = (n) => (n || '').replace(/^Whats App /, '').replace(/^WhatsApp /, '');

      // Hora REAL de la llamada (no la del webhook). El webhook puede tardar
      // horas o días en re-emitir el evento si la cuenta estaba "offline".
      const callDate = (c) => new Date(c.raw?.data?.date || c.ts);

      // Horario laboral MoradaUno (hora CDMX): L-V 9-19, Sáb 9-15, Dom cerrado.
      // El navegador debe estar en TZ America/Mexico_City para que coincida.
      const isBusinessHours = (date) => {
        const day = date.getDay();
        const hour = date.getHours();
        if (day === 0) return false;
        if (day === 6) return hour >= 9 && hour < 15;
        return hour >= 9 && hour < 19;
      };

      // Decorate every call with parsed date + clean agent once
      const allCalls = calls.map(c => ({ ...c, _dt: callDate(c), _agent: cleanInstance(c.instance) }));

      const now = new Date();
      const cutoff30d = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      const calls30d = allCalls.filter(c => c._dt >= cutoff30d);

      // ── KPIs últimos 30 días ─────────────────────────────────────────
      const total30d = calls30d.length;
      const missed30d = calls30d.filter(c => c.missed).length;
      const missedRate30d = total30d ? (missed30d / total30d * 100).toFixed(1) : '0';
      const bizHours30d = calls30d.filter(c => isBusinessHours(c._dt)).length;
      const bizHoursRate30d = total30d ? (bizHours30d / total30d * 100).toFixed(0) : '0';

      // ── Ventana del toggle (daily/weekly/monthly) ────────────────────
      // daily   → últimos 30 días, 1 barra por día
      // weekly  → últimas 12 semanas (lunes-domingo CDMX), 1 barra por semana
      // monthly → últimos 6 meses, 1 barra por mes
      const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
      const startOfWeek = (d) => {
        const x = startOfDay(d);
        const day = x.getDay(); // 0=Sun
        const diff = (day === 0 ? -6 : 1 - day); // back to Monday
        x.setDate(x.getDate() + diff);
        return x;
      };
      const startOfMonth = (d) => { const x = new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; };
      const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
      const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };

      let windowStart, buckets;
      if (windowMode === 'daily') {
        windowStart = addDays(startOfDay(now), -29);
        buckets = Array.from({length: 30}, (_, i) => {
          const s = addDays(windowStart, i);
          const e = addDays(s, 1);
          return { start: s, end: e, label: s.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', timeZone: 'America/Mexico_City' }) };
        });
      } else if (windowMode === 'weekly') {
        windowStart = addDays(startOfWeek(now), -7 * 11);
        buckets = Array.from({length: 12}, (_, i) => {
          const s = addDays(windowStart, i * 7);
          const e = addDays(s, 7);
          return { start: s, end: e, label: s.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', timeZone: 'America/Mexico_City' }) };
        });
      } else {
        windowStart = addMonths(startOfMonth(now), -5);
        buckets = Array.from({length: 6}, (_, i) => {
          const s = addMonths(windowStart, i);
          const e = addMonths(s, 1);
          return { start: s, end: e, label: s.toLocaleDateString('es-MX', { month: 'short', year: '2-digit', timeZone: 'America/Mexico_City' }) };
        });
      }
      const callsWindow = allCalls.filter(c => c._dt >= windowStart && c._dt < buckets[buckets.length - 1].end);

      // Series de tiempo: cada bucket con totales + perdidas
      buckets.forEach(b => { b.total = 0; b.missed = 0; });
      callsWindow.forEach(c => {
        for (const b of buckets) {
          if (c._dt >= b.start && c._dt < b.end) {
            b.total++;
            if (c.missed) b.missed++;
            break;
          }
        }
      });

      // Por agente en la ventana seleccionada
      const byAgentWin = {};
      callsWindow.forEach(c => {
        const a = c._agent;
        if (!byAgentWin[a]) byAgentWin[a] = { total: 0, missed: 0 };
        byAgentWin[a].total++;
        if (c.missed) byAgentWin[a].missed++;
      });
      const agentRows = Object.entries(byAgentWin)
        .map(([agent, s]) => ({
          agent,
          total: s.total,
          missed: s.missed,
          answered: s.total - s.missed,
          missedRate: s.total ? (s.missed / s.total * 100) : 0,
        }))
        .sort((a, b) => b.total - a.total);
      const maxAgentTotal = Math.max(1, ...agentRows.map(a => a.total));

      // ── Datos que siguen usando TODAS las llamadas (no afectados por toggle) ─
      const byHour = Array.from({length: 24}, () => ({total: 0, missed: 0}));
      const byClient = {};
      allCalls.forEach(c => {
        const hour = c._dt.getHours();
        if (hour >= 0 && hour < 24) {
          byHour[hour].total++;
          if (c.missed) byHour[hour].missed++;
        }
        if (c.remote) {
          if (!byClient[c.remote]) byClient[c.remote] = { total: 0, missed: 0, agents: new Set(), lastCall: c._dt };
          byClient[c.remote].total++;
          if (c.missed) byClient[c.remote].missed++;
          byClient[c.remote].agents.add(c._agent);
          if (c._dt > byClient[c.remote].lastCall) byClient[c.remote].lastCall = c._dt;
        }
      });

      const totalCalls = allCalls.length;

      const recentCalls = [...allCalls]
        .sort((a, b) => b._dt - a._dt)
        .slice(0, 20);

      const fmtMxTime = (d) => d.toLocaleString('es-MX', {
        weekday: 'short', day: '2-digit', month: 'short',
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZone: 'America/Mexico_City',
      });

      const repeatCallers = Object.entries(byClient)
        .filter(([_, v]) => v.total >= 3)
        .sort((a, b) => b[1].total - a[1].total)
        .slice(0, 10);

      const empty = totalCalls === 0;
      const maxBucketTotal = Math.max(1, ...buckets.map(b => b.total));
      const windowMissed = callsWindow.filter(c => c.missed).length;
      const windowMissedRate = callsWindow.length ? (windowMissed / callsWindow.length * 100) : 0;
      const windowLabel = windowMode === 'daily' ? 'Últimos 30 días'
                        : windowMode === 'weekly' ? 'Últimas 12 semanas'
                        : 'Últimos 6 meses';

      const lastUpdatedStr = lastUpdated ? lastUpdated.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
      return (
        <Section title="Llamadas WhatsApp" id="calls">
          <div className="bg-white rounded-xl p-4 mb-6 border border-teal/20 flex items-center justify-between flex-wrap gap-3">
            <p className="text-xs text-gray-600">
              📡 Live data · {totalCalls} llamadas registradas
              <span className="ml-3 text-gray-400">Actualizado: {lastUpdatedStr}</span>
              <span className="ml-3 inline-flex items-center gap-1 text-teal">
                <span className={`w-2 h-2 rounded-full bg-teal ${refreshing ? 'animate-pulse' : ''}`}></span>
                Auto-refresh 30s
              </span>
            </p>
            <button
              onClick={fetchCalls}
              disabled={refreshing}
              className="text-xs bg-teal/10 hover:bg-teal/20 text-teal font-semibold px-3 py-1.5 rounded-md transition-colors disabled:opacity-50"
            >
              {refreshing ? 'Actualizando...' : '↻ Refrescar ahora'}
            </button>
          </div>

          {empty && (
            <div className="bg-white rounded-xl p-12 text-center">
              <div className="text-5xl mb-3">📞</div>
              <p className="text-gray-700 font-bold mb-1">Esperando datos de llamadas</p>
              <p className="text-gray-500 text-sm max-w-md mx-auto">El webhook está activo. Los datos aparecerán aquí en cuanto entren las primeras llamadas a las cuentas conectadas.</p>

    function AgentRankingTable() {
      const getRateColor = (rate) => rate === null ? '#94A3B8' : rate >= 50 ? '#E8505B' : rate >= 35 ? '#F97316' : rate >= 20 ? '#FACC15' : '#2EC4B6';
      const getRateBg = (rate) => rate === null ? '#F1F5F9' : rate >= 50 ? '#FEE2E2' : rate >= 35 ? '#FEF3C7' : rate >= 20 ? '#FEF9C3' : '#D1FAE5';
      // Sort by latest available rate
      const sorted = [...agentRanking].sort((a, b) => (medUltimo(b) ?? 0) - (medUltimo(a) ?? 0));
      const renderCell = (val) => {
        if (val === null || val === undefined) return <span className="text-xs text-gray-300">—</span>;
        return <span className="inline-block text-xs font-bold px-2 py-0.5 rounded-full" style={{color: getRateColor(val), backgroundColor: getRateBg(val)}}>{val}%</span>;
      };
      return (
        <Section title="Ranking de Agentes CS — 7 Mediciones" id="agents">
          {/* Methodology explanation */}
          <div className="bg-white rounded-xl p-5 mb-5 shadow-sm border-l-4 border-coral">
            <h3 className="text-base font-bold text-navy-dark mb-2">¿Cómo se mide la frustración?</h3>
            <p className="text-sm text-gray-600 mb-3">
              Cada conversación se clasifica como "frustrada" si el broker mostró señales claras de molestia.
              La <strong>tasa de frustración</strong> de un agente = % de sus conversaciones con frustración detectada.
            </p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
              <div className="bg-coral/5 border border-coral/20 rounded-lg p-3">
                <p className="font-bold text-coral mb-1.5">🚨 Severa (3% de los casos)</p>
                <ul className="text-gray-700 space-y-1">
                  <li>• ALL CAPS sostenido (ej. "URGENTE", "ME LLAMAS")</li>
                  <li>• Amenaza de cambiar de empresa o escalar</li>
                  <li>• Mensajes en cadena sin respuesta del agente</li>
                  <li>• Lenguaje tipo "esto es inaceptable"</li>
                </ul>
              </div>
              <div className="bg-orange-50 border border-orange-200 rounded-lg p-3">
                <p className="font-bold text-orange-600 mb-1.5">⚠️ Moderada (6% de los casos)</p>
                <ul className="text-gray-700 space-y-1">
                  <li>• Quejas explícitas ("no es la primera vez", "ya van 3 veces")</li>
                  <li>• Seguimientos repetidos sin respuesta</li>
                  <li>• Cambios solicitados varias veces</li>
                  <li>• Pone a sus clientes/jefes como presión</li>
                </ul>
              </div>
              <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                <p className="font-bold text-yellow-700 mb-1.5">😐 Leve (7% de los casos)</p>
                <ul className="text-gray-700 space-y-1">
                  <li>• Impaciencia ("me urge", "para hoy")</li>
                  <li>• Emojis tristes o de exasperación (😔😩🙏)</li>
                  <li>• Preguntas como "¿alguien me puede ayudar?"</li>
                  <li>• Repetir un mismo mensaje 2-3 veces</li>
                </ul>
              </div>
            </div>
            <div className="mt-3 p-3 bg-gray-50 rounded-lg text-xs text-gray-600">
              <strong className="text-gray-800">Cómo se ejecuta:</strong> En cada corrida, ~10-12 conversaciones representativas por agente
              se envían a Claude (Anthropic API) que clasifica cada una como frustrada o no, basándose en estos criterios.
              La tasa final es el % de conversaciones marcadas como frustradas (severa + moderada + leve cuentan como "frustrada").
              No es 100% objetivo, pero es consistente entre corridas.
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[820px]">
                <thead>
                  <tr className="bg-navy-dark text-white">
                    <th className="py-3 px-3 text-left text-xs font-semibold w-12">#</th>
                    <th className="py-3 px-3 text-left text-xs font-semibold">Agente CS</th>
                    {MED.map(m => (
                      <th key={m.key} className={`py-3 px-3 text-center text-xs font-semibold ${m.key === MED_ULT.key ? 'bg-teal/20' : ''}`}>{m.label}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((a, i) => (
                    <tr key={i} className={`border-b border-gray-100 ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-gray-100 transition-colors`}>

                      ))}

                </tbody>
              </table>
            </div>
            <div className="px-4 py-3 bg-gray-50 border-t">
              <p className="text-xs text-gray-400">* Tasa aprox. basada en muestra representativa por agente · "—" = cuenta no conectada a Evolution API en esa fecha · Total: 27 agentes detectados, 21 con datos en Jun 2</p>
            </div>
          </div>

    function ImprovementAreasSection() {

    function Footer() {

            <p className="text-gray-600 text-xs mt-1">{`${MED.length} mediciones de frustración: ${MED.map(m => m.label).join(' · ')} (última con ${MED_ULT.agentes} agentes)`}</p>

    // ── Per-agent structured feedback (auto-generated from metrics) ─────────
    // Returns an object with: grade, strengths[], improvements[], actions[], trend
    // callStats: optional { [firstName]: { totalBiz, missedBiz, missedBizRate } }
    function generateFeedback(agentName, callStats) {
      // Find the agent's data across all sources
      const ranking = agentRanking.find(a => a.name === agentName);
      const responseT = responseTimes.find(r => r.agent === agentName || r.agent === agentName.replace(/^Whats App /, ''));
      const writing = writingQuality.find(w => w.agent === agentName);
      const resolution = resolutionData.find(r => r.agent === agentName);
      const firstName = agentName.split(' ')[0].toLowerCase();
      const callRow = callStats ? (callStats[firstName] || null) : null;

      const strengths = [];
      const improvements = [];
      const actions = [];
      let trend = 'sin-datos';
      let trendNote = '';

      // === Frustration analysis ===
      const fAll = medValores(ranking);
      const latest = fAll[fAll.length - 1];
      const earliest = fAll[0];
      const frustHistory = fAll;

      if (latest !== undefined) {
        if (latest <= 15) strengths.push(`Tasa de frustración muy baja (${latest}%) — top tier del equipo`);
        else if (latest <= 25) strengths.push(`Tasa de frustración aceptable (${latest}%)`);
        else if (latest <= 40) improvements.push(`Tasa de frustración elevada (${latest}%) — revisar interacciones difíciles`);
        else improvements.push(`Tasa de frustración crítica (${latest}%) — atención inmediata`);

        if (fAll.length >= 2) {
          const delta = latest - earliest;
          if (delta <= -10) {
            trend = 'mejorando';
            trendNote = `Mejoró ${Math.abs(delta)} pts vs primera medición (${earliest}% → ${latest}%)`;
            strengths.push(`Tendencia positiva: ${trendNote}`);
          } else if (delta >= 10) {
            trend = 'empeorando';
            trendNote = `Subió ${delta} pts vs primera medición (${earliest}% → ${latest}%)`;
            improvements.push(`Tendencia negativa: ${trendNote}`);
          } else {
            trend = 'estable';
            trendNote = `Estable en ${latest}% (rango ${Math.min(...fAll)}-${Math.max(...fAll)}%)`;
          }
        } else {
          trend = 'inicial';
          trendNote = `Primera medición disponible: ${latest}%`;
        }
      }

      // === Response time analysis ===
      if (responseT) {
        if (responseT.median < 5) {
          strengths.push(`Mediana de respuesta excelente (${responseT.median.toFixed(1)} min)`);
        } else if (responseT.median < 15) {
          strengths.push(`Mediana de respuesta buena (${responseT.median.toFixed(1)} min)`);
        } else if (responseT.median < 30) {
          improvements.push(`Mediana de respuesta lenta (${responseT.median.toFixed(1)} min)`);
          actions.push('Apuntar a responder en menos de 15 min en horario laboral');
        } else {
          improvements.push(`Mediana de respuesta crítica (${responseT.median.toFixed(1)} min)`);
          actions.push('Revisar carga de trabajo o escalación — la mediana debería estar bajo 15 min');
        }

        if (responseT.under5 >= 60) strengths.push(`${responseT.under5}% de respuestas en menos de 5 min`);
        if (responseT.under30 < 70) improvements.push(`Solo ${responseT.under30}% responde en menos de 30 min`);
        if (responseT.avg > responseT.median * 5) {
          improvements.push(`Algunos brokers esperan mucho — promedio (${responseT.avg < 60 ? responseT.avg.toFixed(0) + ' min' : (responseT.avg/60).toFixed(1) + ' h'}) muy alto vs mediana`);
          actions.push('Identificar conversaciones que se quedan sin respuesta más de 1 hora');
        }
      }

      // === Writing quality analysis ===
      if (writing) {
        if (writing.score < 10) {
          strengths.push(`Escritura impecable (score ${writing.score}, ${writing.typos} typos por 100 msg)`);
        } else if (writing.score < 25) {
          // neutral
        } else {
          improvements.push(`Calidad de escritura a mejorar (score ${writing.score})`);
        }

        if (writing.typos > 2) {
          improvements.push(`${writing.typos} typos por cada 100 mensajes`);
          actions.push('Activar autocorrector de WhatsApp y revisar antes de enviar');
        }
        if (writing.lowerStart > 25) {
          improvements.push(`${writing.lowerStart}% de mensajes inician con minúscula`);
          actions.push('Iniciar siempre con mayúscula — proyecta más profesionalismo');
        }
        if (writing.missingAccents > 8) {
          improvements.push(`${writing.missingAccents}% de palabras sin acento`);
          actions.push('Habilitar teclado en español con acentos automáticos');
        }
        if (writing.emojiPerMsg > 0.5) {
          improvements.push(`Uso excesivo de emojis (${writing.emojiPerMsg}/mensaje)`);
        }
        if (writing.examples?.bad?.length > 0) {
          writing.examples.bad.forEach(b => improvements.push(b));
        }
      }

      // === Resolution effectiveness ===
      if (resolution) {
        if (resolution.resolvedPct >= 65) {
          strengths.push(`Alta tasa de resolución (${resolution.resolvedPct}% de conversaciones cerradas exitosamente)`);
        } else if (resolution.resolvedPct >= 50) {
          // neutral
        } else {
          improvements.push(`Tasa de resolución baja (${resolution.resolvedPct}%) — muchas conversaciones quedan sin cierre claro`);
          actions.push('Cerrar conversaciones con confirmación explícita ("¿queda algo más?", "te confirmo cuando quede listo")');
        }
        if (resolution.unresolvedPct >= 5) {
          improvements.push(`${resolution.unresolvedPct}% conversaciones terminan con el broker frustrado o sin solución`);
        }
        if (resolution.escalationPct > 50) {
          improvements.push(`${resolution.escalationPct}% de conversaciones requieren escalar a otro equipo — muchos cuellos de botella internos`);
          actions.push('Documentar qué casos se pueden resolver internamente para no escalar tanto');
        }
      }

      // === Calls (live webhook) — % perdidas en horario laboral ===
      if (callRow && callRow.totalBiz > 0) {
        const rate = Math.round(callRow.missedBiz / callRow.totalBiz * 100);
        if (rate <= 10) {
          strengths.push(`Disponibilidad telefónica alta (${rate}% perdidas en horario laboral · ${callRow.missedBiz}/${callRow.totalBiz})`);
        } else if (rate <= 25) {
          // neutral
        } else if (rate <= 50) {
          improvements.push(`${rate}% de llamadas perdidas en horario laboral (${callRow.missedBiz}/${callRow.totalBiz})`);
          actions.push('Revisar disponibilidad o redirigir llamadas cuando esté ocupado');
        } else {
          improvements.push(`Tasa crítica de llamadas perdidas en horario laboral: ${rate}% (${callRow.missedBiz}/${callRow.totalBiz})`);
          actions.push('Más de la mitad de las llamadas no se contestan en horario laboral — atención inmediata');
        }
      }

      // === Coverage / data freshness ===
      const today = new Date().toISOString().slice(0, 10);
      if (ranking?.lastSeen) {
        const daysSince = Math.floor((new Date(today) - new Date(ranking.lastSeen)) / (1000 * 60 * 60 * 24));
        if (daysSince > 14) {
          improvements.push(`Sin datos recientes desde ${ranking.lastSeen} (${daysSince} días)`);
          actions.push('Reconectar la cuenta de WhatsApp en Evolution API');
        }
      }

      return {
        strengths, improvements, actions,
        trend, trendNote,
        frustHistory,
        hasResponseData: !!responseT,
        hasWritingData: !!writing,
        responseT, writing, ranking, callRow,
      };
    }

    // Helper: read a metric for an agent and return { value, displayValue, color, label, ok }
    // callStats: optional { [firstName]: { totalBiz, missedBiz, missedBizRate } } from FeedbackSection
    function getMetrics(agentName, callStats) {
      const ranking = agentRanking.find(a => a.name === agentName);
      const responseT = responseTimes.find(r => r.agent === agentName || r.agent === agentName.replace(/^Whats App /, ''));
      const writing = writingQuality.find(w => w.agent === agentName);
      const resolution = resolutionData.find(r => r.agent === agentName);

      // Frustration: latest available
      const fAll = ranking ? medValores(ranking) : [];
      const frustration = fAll.length ? fAll[fAll.length - 1] : null;

      // Calls: aggregate from live data, matching agent first name to instance
      const firstName = agentName.split(' ')[0].toLowerCase();
      const callRow = callStats ? (callStats[firstName] || null) : null;
      const callsBizMissedRate = (callRow && callRow.totalBiz > 0) ? Math.round(callRow.missedBiz / callRow.totalBiz * 100) : null;

      const colorByFrust = (v) => v === null ? '#94A3B8' : v <= 15 ? '#2EC4B6' : v <= 30 ? '#22C55E' : v <= 45 ? '#F97316' : '#E8505B';
      const colorByResp  = (v) => v === null ? '#94A3B8' : v < 5 ? '#2EC4B6' : v < 15 ? '#22C55E' : v < 30 ? '#F97316' : '#E8505B';
      const colorByGrade = (g) => g === null ? '#94A3B8' : g >= 85 ? '#2EC4B6' : g >= 70 ? '#22C55E' : g >= 55 ? '#F97316' : '#E8505B';
      const colorByRes   = (v) => v === null ? '#94A3B8' : v >= 65 ? '#2EC4B6' : v >= 50 ? '#22C55E' : v >= 35 ? '#F97316' : '#E8505B';
      const colorByMiss  = (v) => v === null ? '#94A3B8' : v <= 10 ? '#2EC4B6' : v <= 25 ? '#22C55E' : v <= 50 ? '#F97316' : '#E8505B';

      const writingGrade = writing ? Math.max(0, Math.min(100, Math.round(100 - writing.score * 1.2))) : null;

      return {
        ranking, responseT, writing, resolution, callRow,
        frustration: { value: frustration, color: colorByFrust(frustration), display: frustration !== null ? `${frustration}%` : '—' },
        responseTime: { value: responseT?.median ?? null, color: colorByResp(responseT?.median ?? null),
          display: responseT ? (responseT.median < 60 ? `${responseT.median.toFixed(1)} min` : `${(responseT.median/60).toFixed(1)} h`) : '—' },
        writingGrade: { value: writingGrade, color: colorByGrade(writingGrade), display: writingGrade !== null ? `${writingGrade}/100` : '—' },
        resolutionPct: { value: resolution?.resolvedPct ?? null, color: colorByRes(resolution?.resolvedPct ?? null),
          display: resolution ? `${resolution.resolvedPct}%` : '—' },
        callsBizMissed: {
          value: callsBizMissedRate,
          color: colorByMiss(callsBizMissedRate),
          display: callsBizMissedRate !== null ? `${callsBizMissedRate}%` : '—',
          sub: callRow ? `${callRow.missedBiz}/${callRow.totalBiz} en horario` : 'sin datos',
        },
      };
    }

    // Convierte cada métrica disponible a un score 0-100 y promedia para sacar la calificación
    function gradeFromMetrics(m) {
      const scores = [];
      if (m.frustration.value !== null) scores.push({ key: 'frustración', s: Math.max(0, Math.min(100, 100 - m.frustration.value * 2)) });
      if (m.resolutionPct.value !== null) scores.push({ key: 'resolución', s: m.resolutionPct.value });
      if (m.responseTime.value !== null) {
        const med = m.responseTime.value;
        const s = med < 5 ? 100 : med < 15 ? 80 : med < 30 ? 60 : med < 60 ? 40 : 20;
        scores.push({ key: 'respuesta', s });
      }
      if (m.writingGrade.value !== null) scores.push({ key: 'escritura', s: m.writingGrade.value });
      if (m.callsBizMissed.value !== null) scores.push({ key: 'llamadas', s: 100 - m.callsBizMissed.value });

      if (scores.length === 0) return { grade: '—', gradeColor: '#94A3B8', gradeLabel: 'Sin datos suficientes', score: null, scores };
      const avg = Math.round(scores.reduce((s, x) => s + x.s, 0) / scores.length);
      let grade, gradeColor, gradeLabel;
      if (avg >= 85)      { grade = 'A'; gradeColor = '#2EC4B6'; gradeLabel = 'Excelente desempeño'; }
      else if (avg >= 70) { grade = 'B'; gradeColor = '#22C55E'; gradeLabel = 'Buen desempeño'; }
      else if (avg >= 55) { grade = 'C'; gradeColor = '#F97316'; gradeLabel = 'Aceptable, oportunidades claras'; }
      else                { grade = 'D'; gradeColor = '#E8505B'; gradeLabel = 'Requiere atención y coaching'; }
      return { grade, gradeColor, gradeLabel, score: avg, scores };
    }

    // Pill compacto para celdas de métrica
    function MetricCell({ value, color, sub }) {
      return (
        <div className="flex flex-col items-center">
          <div className="text-sm font-bold" style={{color}}>{value}</div>
          {sub && <div className="text-[10px] text-gray-400 mt-0.5">{sub}</div>}
        </div>
      );
    }

    function FeedbackRow({ f, m, expanded, onToggle }) {
      const dateStr = f.agent.lastSeen ? new Date(f.agent.lastSeen).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : '—';
      return (
        <>
          <tr
            onClick={onToggle}
            className="border-b border-gray-100 cursor-pointer hover:bg-coral/5 transition-colors"
          >
            <td className="py-3 px-3 text-center">
              <div className="inline-flex items-center justify-center w-9 h-9 rounded-full text-base font-extrabold text-white" style={{backgroundColor: f.grade.gradeColor}}>
                {f.grade.grade}
              </div>
              {f.grade.score !== null && (
                <div className="text-[10px] text-gray-400 mt-1">{f.grade.score}/100</div>
              )}
            </td>
            <td className="py-3 px-3">
              <div className="flex items-center gap-2">
                <span className="text-sm font-semibold text-navy-dark">{f.name}</span>
                {f.agent.isBrandNew && <span className="text-[9px] text-teal bg-teal/10 px-1.5 py-0.5 rounded font-semibold">NUEVO</span>}

    // ── Correlaciones: frustración vs cada métrica ─────────────────────────
    // Pearson r y scatter por agente. Pensado para crecer con más data.
    function pearsonR(xs, ys) {
      const n = xs.length;
      if (n < 2) return null;
      const mx = xs.reduce((s, x) => s + x, 0) / n;
      const my = ys.reduce((s, y) => s + y, 0) / n;
      let cov = 0, sx = 0, sy = 0;
      for (let i = 0; i < n; i++) {
        const dx = xs[i] - mx, dy = ys[i] - my;
        cov += dx * dy; sx += dx * dx; sy += dy * dy;
      }
      const denom = Math.sqrt(sx * sy);
      return denom > 0 ? cov / denom : null;
    }

    function linearRegression(xs, ys) {
      const n = xs.length;
      if (n < 2) return null;
      const mx = xs.reduce((s, x) => s + x, 0) / n;
      const my = ys.reduce((s, y) => s + y, 0) / n;
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
      if (den === 0) return null;
      const slope = num / den;
      const intercept = my - slope * mx;
      return { slope, intercept };
    }

    function ScatterChart({ title, xLabel, points, xMin, xMax, invertX }) {
      // points: [{ name, x, y }]
      const valid = points.filter(p => p.x !== null && p.x !== undefined && p.y !== null && p.y !== undefined);
      const xs = valid.map(p => p.x);
      const ys = valid.map(p => p.y);
      const r = pearsonR(xs, ys);
      const reg = linearRegression(xs, ys);
      const rSign = invertX && r !== null ? -r : r;  // dirección "esperada"
      const rColor = rSign === null ? '#94A3B8' : Math.abs(rSign) >= 0.5 ? '#1B2A4A' : Math.abs(rSign) >= 0.3 ? '#F97316' : '#94A3B8';
      const significant = rSign !== null && Math.abs(rSign) >= 0.75;

      const W = 320, H = 220, PAD_L = 40, PAD_R = 18, PAD_T = 14, PAD_B = 38;
      const innerW = W - PAD_L - PAD_R;
      const innerH = H - PAD_T - PAD_B;
      const yMin = 0, yMax = 60;
      const xLo = xMin, xHi = xMax;
      const xFor = (v) => PAD_L + ((v - xLo) / (xHi - xLo)) * innerW;
      const yFor = (v) => PAD_T + (1 - (v - yMin) / (yMax - yMin)) * innerH;

      // Trend line endpoints
      let trendPath = null;
      if (reg) {
        const x1 = xLo, x2 = xHi;
        const y1 = Math.max(yMin, Math.min(yMax, reg.intercept + reg.slope * x1));
        const y2 = Math.max(yMin, Math.min(yMax, reg.intercept + reg.slope * x2));
        trendPath = `M ${xFor(x1)} ${yFor(y1)} L ${xFor(x2)} ${yFor(y2)}`;
      }

      const xTicks = 4, yTicks = 4;
      return (
        <div className="bg-white rounded-xl p-4 shadow-sm">
          <div className="flex items-baseline justify-between mb-1">
            <h3 className="font-bold text-sm text-navy-dark">{title}</h3>
            <div className="text-right">
              <div className="text-lg font-extrabold leading-none" style={{color: rColor}}>{r === null ? '—' : `r = ${r >= 0 ? '+' : ''}${r.toFixed(2)}`}</div>
              <div className="text-[10px] text-gray-400">n = {valid.length}{significant ? ' · sig.' : ''}</div>
            </div>
          </div>
          <p className="text-[11px] text-gray-500 mb-2">Cada punto es un asesor</p>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height: 'auto'}}>
            {/* Grid lines + Y axis */}
            {Array.from({length: yTicks + 1}, (_, i) => {
              const v = yMin + (i * (yMax - yMin)) / yTicks;
              const y = yFor(v);
              return (
                <g key={'y'+i}>
                  <line x1={PAD_L} y1={y} x2={W - PAD_R} y2={y} stroke="#E5E7EB" strokeWidth="0.5"/>
                  <text x={PAD_L - 6} y={y + 3} textAnchor="end" fontSize="9" fill="#94A3B8">{Math.round(v)}%</text>
                </g>
              );
            })}
            {/* X axis ticks */}
            {Array.from({length: xTicks + 1}, (_, i) => {
              const v = xLo + (i * (xHi - xLo)) / xTicks;
              const x = xFor(v);
              return (
                <g key={'x'+i}>
                  <line x1={x} y1={H - PAD_B} x2={x} y2={H - PAD_B + 4} stroke="#94A3B8" strokeWidth="0.6"/>
                  <text x={x} y={H - PAD_B + 14} textAnchor="middle" fontSize="9" fill="#94A3B8">
                    {(xHi - xLo) <= 5 ? v.toFixed(1) : Math.round(v)}
                  </text>
                </g>
              );
            })}
            {/* Axis labels */}
            <text x={PAD_L + innerW/2} y={H - 4} textAnchor="middle" fontSize="10" fill="#6B7280" fontWeight="600">{xLabel}</text>
            <text transform={`rotate(-90, 12, ${PAD_T + innerH/2})`} x={12} y={PAD_T + innerH/2} textAnchor="middle" fontSize="10" fill="#6B7280" fontWeight="600">Frustración %</text>
            {/* Trend line */}
            {trendPath && <path d={trendPath} stroke="#94A3B8" strokeWidth="1.5" strokeDasharray="4,3" fill="none"/>}
            {/* Points */}
            {valid.map((p, i) => (
              <g key={i}>
                <circle cx={xFor(p.x)} cy={yFor(p.y)} r="5" fill="#E8505B" stroke="#fff" strokeWidth="1.5"/>
                <text x={xFor(p.x) + 7} y={yFor(p.y) + 3} fontSize="9" fill="#374151" fontWeight="600">{p.name.split(' ')[0]}</text>
              </g>
            ))}
          </svg>
        </div>
      );
    }
