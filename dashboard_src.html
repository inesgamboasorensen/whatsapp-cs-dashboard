              </div>
            ))}
          </div>

          <div className="mt-8 bg-white border border-gray-200 rounded-xl p-5 text-xs text-gray-600 leading-relaxed">
            <p className="text-navy-dark text-sm font-bold mb-2">Notas metodológicas</p>
            <ul className="space-y-1.5 list-disc list-inside">
              <li>Cada punto es un asesor. Eje Y = % de conversaciones con frustración moderada o severa en la medición del {MED_ULT.label.toLowerCase()}. Eje X = la variable indicada.</li>
              <li>Solo entran agentes con dato en ambos ejes y en el mismo periodo; por eso n cambia entre gráficas.</li>
              <li>La línea punteada es la recta de regresión simple. r va de −1 a +1; cerca de 0 = sin relación.</li>
              <li>Llamadas: se empata la instancia con el agente por nombre completo (sin acentos); si no coincide, por primer nombre solo cuando es único. Solo agentes con 5 llamadas o más en horario laboral.</li>
              <li>Son correlaciones por agente, no por conversación: no prueban causa.</li>
            </ul>
          </div>
        </Section>
      );
    }

    // Coverage section — when do we have data up to per agent?
    function DataCoverageSection() {
      const today = new Date().toISOString().slice(0, 10);
      const daysSince = (date) => {
        const d1 = new Date(date);
        const d2 = new Date(today);
        return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
      };
      const sorted = [...agentRanking].sort((a, b) => (b.lastSeen || '').localeCompare(a.lastSeen || ''));
      const fresh = sorted.filter(a => daysSince(a.lastSeen) <= 3).length;
      const stale = sorted.filter(a => daysSince(a.lastSeen) > 14).length;
      return (
        <Section title="Cobertura de Datos por Agente" id="coverage">
          <div className="bg-white rounded-xl p-4 mb-6 border-l-4 border-teal shadow-sm">
            <p className="text-sm text-gray-700 mb-1.5">
              <strong>Qué es:</strong> esta pestaña no mide desempeño — mide si <strong>estamos capturando los datos</strong> de cada agente. El análisis lee los WhatsApp vía Evolution API; si el teléfono de un agente se <strong>desconecta</strong>, dejamos de recibir sus conversaciones.
            </p>
            <p className="text-xs text-gray-500">
              <strong>Por qué importa:</strong> un agente <span style={{color:'#E8505B', fontWeight:600}}>Desconectado</span> aparece con métricas viejas o ausentes en las otras pestañas. Si ves a alguien desconectado, hay que <strong>reconectar su sesión</strong> en el manager para que vuelva a entrar al análisis. "Última información" = la fecha del último mensaje que logramos captar.
            </p>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #2EC4B6'}}>
              <div className="text-3xl font-extrabold text-teal">{fresh}</div>
              <div className="text-xs text-gray-500 mt-1">Agentes con datos recientes (≤3 días)</div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #F97316'}}>
              <div className="text-3xl font-extrabold text-orange-500">{sorted.length - fresh - stale}</div>
              <div className="text-xs text-gray-500 mt-1">Datos parciales (4-14 días)</div>
            </div>
            <div className="bg-white rounded-xl p-5 shadow-sm" style={{borderLeft: '4px solid #E8505B'}}>
              <div className="text-3xl font-extrabold text-coral">{stale}</div>
              <div className="text-xs text-gray-500 mt-1">Sin datos recientes ({'>'} 14 días)</div>
            </div>
          </div>
          <div className="bg-white rounded-xl shadow-sm overflow-hidden">
            <table className="w-full">
              <thead>
                <tr className="bg-navy-dark text-white">
                  <th className="py-3 px-4 text-left text-xs font-semibold">Agente</th>
                  <th className="py-3 px-4 text-center text-xs font-semibold">Última información</th>
                  <th className="py-3 px-4 text-center text-xs font-semibold">Días sin datos</th>
                  <th className="py-3 px-4 text-center text-xs font-semibold">Estado</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((a, i) => {
                  const days = daysSince(a.lastSeen);
                  const status = days <= 3 ? 'Fresco' : days <= 14 ? 'Parcial' : 'Desconectado';
                  const color = days <= 3 ? '#2EC4B6' : days <= 14 ? '#F97316' : '#E8505B';
                  const bg = days <= 3 ? '#D1FAE5' : days <= 14 ? '#FEF3C7' : '#FEE2E2';
                  const fmtDate = new Date(a.lastSeen).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
                  return (
                    <tr key={i} className={`border-b border-gray-100 ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                      <td className="py-3 px-4 text-sm font-medium text-navy-dark">
                        {a.name}
                        {a.isBrandNew && <span className="ml-2 text-xs text-teal bg-teal/10 px-1.5 py-0.5 rounded">NUEVO</span>}
                      </td>
                      <td className="py-3 px-4 text-center text-sm text-gray-700">{fmtDate}</td>
                      <td className="py-3 px-4 text-center text-sm text-gray-500">{days} {days === 1 ? 'día' : 'días'}</td>
                      <td className="py-3 px-4 text-center">
                        <span className="inline-block text-xs font-bold px-2 py-0.5 rounded-full" style={{color, backgroundColor: bg}}>{status}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div className="px-4 py-3 bg-gray-50 border-t">
              <p className="text-xs text-gray-400">Fecha del último mensaje registrado en Evolution API · Si está desconectado, debe reconectarse en el manager para volver a recibir datos</p>
            </div>
          </div>
        </Section>
      );
    }

    // Tab navigation
    // ─── Horarios de Atención ───
    function ScheduleSection() {
      const [gran, setGran] = React.useState('week');     // day | week | month
      const [metric, setMetric] = React.useState('coverage'); // coverage | engaged
      const [mode, setMode] = React.useState('avg');       // avg (h/día) | total (acumulado)
      const A = activityData;

      const round1 = (x) => Math.round(x * 10) / 10;
      const mean = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
      const median = (a) => {
        if (!a.length) return 0;
        const s = [...a].sort((x, y) => x - y), n = s.length;
        return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
      };
      const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
      const fmtMin = (mins) => `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(Math.round(mins % 60)).padStart(2, '0')}`;
      const key = (m) => m === 'coverage' ? 'coverage' : 'engaged';

      // Flatten daily records
      const records = [];
      Object.entries(A.by_agent_day).forEach(([agent, days]) => {
        Object.entries(days).forEach(([date, d]) => records.push({ agent, date, ...d }));
      });

      // Per-agent summary over the whole window
      const agents = Object.keys(A.by_agent_day).map((agent) => {
        const ds = Object.values(A.by_agent_day[agent]);
        const cov = ds.map(d => d.coverage), eng = ds.map(d => d.engaged);
        const firsts = ds.map(d => toMin(d.first)), lasts = ds.map(d => toMin(d.last));
        return {
          agent, days: ds.length,
          meanCov: round1(mean(cov)), medCov: round1(median(cov)), totalCov: Math.round(cov.reduce((s, x) => s + x, 0)),
          meanEng: round1(mean(eng)), medEng: round1(median(eng)), totalEng: Math.round(eng.reduce((s, x) => s + x, 0)),
          startMed: fmtMin(median(firsts)), endMed: fmtMin(median(lasts)),
        };
      }).sort((a, b) => metric === 'coverage' ? b.meanCov - a.meanCov : b.meanEng - a.meanEng);

      // Bucketing for the time-series chart
      const bucketKey = (date) => {
        if (gran === 'day') return date;
        if (gran === 'month') return date.slice(0, 7);
        const dt = new Date(date + 'T00:00:00');
        const dow = (dt.getDay() + 6) % 7; // Monday = 0
        dt.setDate(dt.getDate() - dow);
        return dt.toISOString().slice(0, 10);
      };
      const bucketLabel = (k) => {
        if (gran === 'month') { const [y, m] = k.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month: 'short', year: '2-digit' }); }
        const d = new Date(k + 'T00:00:00');
        const s = d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
        return gran === 'week' ? 'sem ' + s : s;
      };
      const buckets = {};
      records.forEach(r => { const k = bucketKey(r.date); (buckets[k] = buckets[k] || []).push(r[key(metric)]); });
      const bucketList = Object.keys(buckets).sort().map(k => ({
        key: k, label: bucketLabel(k),
        avg: round1(mean(buckets[k])),
        total: Math.round(buckets[k].reduce((s, x) => s + x, 0)),
      }));
      const chartVals = bucketList.map(b => mode === 'avg' ? b.avg : b.total);
      const chartMax = Math.max(1, ...chartVals);

      // Team KPIs over window (per-agent-day basis)
      const allVals = records.map(r => r[key(metric)]);
      const teamMean = round1(mean(allVals));
      const teamMed = round1(median(allVals));
      const teamTotal = Math.round(allVals.reduce((s, x) => s + x, 0));

      const metricLabel = metric === 'coverage' ? 'Ventana de atención (1ª→última)' : 'Horas activas (hrs con actividad)';
      const unit = mode === 'avg' ? 'h/día' : 'h';
      const Seg = ({ value, set, opts }) => (
        <div className="inline-flex bg-navy-card rounded-lg p-1 gap-1">
          {opts.map(o => (
            <button key={o.v} onClick={() => set(o.v)}
              className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-colors ${value === o.v ? 'bg-teal text-navy-dark' : 'text-gray-400 hover:text-white'}`}>
              {o.l}
            </button>
          ))}
        </div>
      );

      const W = 920, H = 220, PADL = 36, PADB = 34, PADT = 14;
      const n = bucketList.length;
      const bw = n ? (W - PADL - 8) / n : 0;
      const labelEvery = Math.ceil(n / 14);

      return (
        <Section title="Horarios de Atención" dark id="schedule">
          <div className="bg-white/5 rounded-xl p-4 mb-6 border border-white/10">
            <p className="text-sm text-gray-300">
              Cuándo están <strong>activos</strong> los agentes de CS, medido por la hora de sus mensajes <strong>enviados</strong> en WhatsApp.
              Ventana <strong>{A.start_date} → {A.end_date}</strong> ({A.window_days} días).
            </p>
            <p className="text-xs text-gray-500 mt-1.5">
              ⚠️ Proxy: refleja cuándo el agente <em>mensajea</em>, no un check-in/out real (llamadas o trabajo interno no aparecen). · <strong>Excluye respuestas automáticas</strong> (fuera de horario / bots de bienvenida). · <strong>Solo días hábiles (lun–vie)</strong>; se excluyen sábados y domingos. · <strong>Ventana</strong> = de su 1er a su último mensaje del día (incluye huecos). · <strong>Horas activas</strong> = nº de horas-reloj distintas con actividad. · Hora local CDMX.
            </p>
          </div>

          {/* Controls */}
          <div className="flex flex-wrap items-center gap-3 mb-6">
            <Seg value={gran} set={setGran} opts={[{ v: 'day', l: 'Día' }, { v: 'week', l: 'Semana' }, { v: 'month', l: 'Mes' }]} />
            <Seg value={metric} set={setMetric} opts={[{ v: 'coverage', l: 'Ventana' }, { v: 'engaged', l: 'Horas activas' }]} />
            <Seg value={mode} set={setMode} opts={[{ v: 'avg', l: 'Promedio h/día' }, { v: 'total', l: 'Acumulado h' }]} />
          </div>

          {/* Team KPI cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="bg-navy-card rounded-xl p-5">
              <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Media del equipo</div>
              <div className="text-3xl font-extrabold text-teal">{teamMean}<span className="text-lg"> h/día</span></div>
              <div className="text-gray-500 text-xs mt-1">{metric === 'coverage' ? 'ventana de atención' : 'horas activas'}</div>
            </div>
            <div className="bg-navy-card rounded-xl p-5">
              <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Mediana del equipo</div>
              <div className="text-3xl font-extrabold text-white">{teamMed}<span className="text-lg"> h/día</span></div>
              <div className="text-gray-500 text-xs mt-1">por agente · por día activo</div>
            </div>
            <div className="bg-navy-card rounded-xl p-5">
              <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Acumulado del equipo</div>
              <div className="text-3xl font-extrabold text-orange-400">{teamTotal.toLocaleString('es-MX')}<span className="text-lg"> h</span></div>
              <div className="text-gray-500 text-xs mt-1">en la ventana de {A.window_days} días</div>
            </div>
            <div className="bg-navy-card rounded-xl p-5">
              <div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Agentes monitoreados</div>
              <div className="text-3xl font-extrabold text-white">{agents.length}</div>
              <div className="text-gray-500 text-xs mt-1">{records.length.toLocaleString('es-MX')} días-agente</div>
            </div>
          </div>

          {/* Time-series bar chart */}
          <div className="bg-navy-card rounded-xl p-6 mb-8">
            <div className="flex items-baseline justify-between flex-wrap gap-2 mb-4">
              <h3 className="text-white text-lg font-bold">{mode === 'avg' ? 'Promedio de horas/día' : 'Horas acumuladas'} · {gran === 'day' ? 'por día' : gran === 'week' ? 'por semana' : 'por mes'}</h3>
              <span className="text-xs text-gray-400">{metricLabel}</span>
            </div>
            <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ minHeight: '180px' }}>
              {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
                const y = PADT + (1 - f) * (H - PADT - PADB);
                return (
                  <g key={i}>
                    <line x1={PADL} y1={y} x2={W} y2={y} stroke="#1e293b" strokeWidth="1" />
                    <text x={PADL - 6} y={y + 3} textAnchor="end" fill="#64748b" fontSize="9">{Math.round(chartMax * f)}</text>
                  </g>
                );
              })}
              {bucketList.map((b, i) => {
                const v = mode === 'avg' ? b.avg : b.total;
                const h = (v / chartMax) * (H - PADT - PADB);
                const x = PADL + 4 + i * bw;
                return (
                  <g key={b.key}>
                    <rect x={x} y={H - PADB - h} width={Math.max(1, bw - 2)} height={h} rx={Math.min(2, bw / 3)} fill="#2EC4B6" opacity="0.88">
                      <title>{b.label}: {mode === 'avg' ? b.avg + ' h/día' : b.total + ' h'}</title>
                    </rect>
                    {(i % labelEvery === 0) && (
                      <text x={x + bw / 2} y={H - PADB + 12} textAnchor="middle" fill="#64748b" fontSize="9">{b.label}</text>
                    )}
                  </g>
                );
              })}
            </svg>
            <p className="text-xs text-gray-500 mt-2">Cada barra = {mode === 'avg' ? 'promedio de horas/día por agente activo' : 'suma de horas-agente'} en ese {gran === 'day' ? 'día' : gran === 'week' ? 'semana' : 'mes'}. Pasa el cursor para ver el valor.</p>
          </div>

          {/* Per-agent table */}
          <div className="bg-white rounded-xl shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[760px]">
                <thead>
                  <tr className="bg-navy-dark text-white">
                    <th className="py-3 px-3 text-left text-xs font-semibold w-12">#</th>
                    <th className="py-3 px-3 text-left text-xs font-semibold">Agente CS</th>
                    <th className="py-3 px-3 text-center text-xs font-semibold">Días activos</th>
                    <th className="py-3 px-3 text-center text-xs font-semibold bg-teal/20">Media h/día</th>
                    <th className="py-3 px-3 text-center text-xs font-semibold">Mediana h/día</th>
                    <th className="py-3 px-3 text-center text-xs font-semibold">Acumulado h</th>
                    <th className="py-3 px-3 text-center text-xs font-semibold">Horario típico</th>
                  </tr>
                </thead>
                <tbody>
                  {agents.map((a, i) => {
                    const meanV = metric === 'coverage' ? a.meanCov : a.meanEng;
                    const medV = metric === 'coverage' ? a.medCov : a.medEng;
                    const totV = metric === 'coverage' ? a.totalCov : a.totalEng;
                    const barPct = Math.min(100, (meanV / 12) * 100);
                    return (
                      <tr key={a.agent} className={`border-b border-gray-100 ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-gray-100 transition-colors`}>
                        <td className="py-3 px-3 text-sm text-gray-400 font-mono">{i + 1}</td>
                        <td className="py-3 px-3 text-sm font-medium text-navy-dark">{a.agent}</td>
                        <td className="py-3 px-3 text-center text-sm text-gray-600">{a.days}</td>
                        <td className="py-3 px-3 bg-teal/5">
                          <div className="flex items-center gap-2">
                            <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                              <div className="h-full rounded-full" style={{ width: `${barPct}%`, background: '#2EC4B6' }}></div>
                            </div>
                            <span className="text-sm font-bold text-navy-dark w-10 text-right">{meanV}</span>
                          </div>
                        </td>
                        <td className="py-3 px-3 text-center text-sm text-gray-700">{medV}</td>
                        <td className="py-3 px-3 text-center text-sm font-semibold text-navy-dark">{totV.toLocaleString('es-MX')}</td>
                        <td className="py-3 px-3 text-center text-xs text-gray-500 font-mono">{a.startMed}–{a.endMed}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="px-4 py-3 bg-gray-50 border-t">
              <p className="text-xs text-gray-400">
                Columnas reflejan la métrica seleccionada ({metric === 'coverage' ? 'Ventana de atención' : 'Horas activas'}). "Horario típico" = mediana de la 1ª y última hora de mensaje (hora CDMX). Ventana {A.start_date} → {A.end_date}.
              </p>
            </div>
          </div>
        </Section>
      );
    }

    // ─── Manejo de Contratos ───
    function ContractHandlingSection() {
      const d = contratosActual;
      const [sortKey, setSortKey] = React.useState('problemRate'); // problemRate | recoveryPct
      // en una corrida, un agente sin conversaciones de contrato en la muestra no tiene %
      const agents = d.agents.filter(a => a.contractConvs > 0).sort((a, b) =>
        sortKey === 'problemRate'
          ? b.problemRate - a.problemRate
          : (a.recoveryPct == null ? 101 : a.recoveryPct) - (b.recoveryPct == null ? 101 : b.recoveryPct));
      const colRate = (p) => p >= 45 ? '#E8505B' : p >= 30 ? '#F97316' : p >= 20 ? '#FACC15' : '#2EC4B6';
      const colRec = (p) => p == null ? '#94A3B8' : p >= 70 ? '#2EC4B6' : p >= 50 ? '#22C55E' : p >= 33 ? '#F97316' : '#E8505B';
      // CRÍTICO = alto % con problema (>=40) Y baja recuperación (<50%) — donde deben enfocarse los managers
      // en una corrida la muestra por agente es chica: sin n suficiente no se marca a nadie
      const isCritical = (a) => a.problemRate >= 40 && a.recoveryPct != null && a.recoveryPct < 50 && (!d.corrida || a.contractConvs >= RES_MIN_N);
      const critical = agents.filter(isCritical).sort((a, b) => b.problemRate - a.problemRate);
      const Seg = ({ value, set, opts }) => (
        <div className="inline-flex bg-white border border-gray-200 rounded-lg p-1 gap-1 shadow-sm">
          {opts.map(o => (
            <button key={o.v} onClick={() => set(o.v)}
              className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-colors ${value === o.v ? 'bg-navy-dark text-white' : 'text-gray-500 hover:text-navy-dark'}`}>{o.l}</button>
          ))}
        </div>
      );
      return (
        <Section title="Manejo de Contratos" id="contracts">
          {diasDesde(d.fechaRef) > DIAS_VIEJO && (d.corrida
            ? <AvisoViejo periodo={d.periodo} que="La última corrida que midió contratos es de hace más de 45 días." detalle="Revisa que el análisis quincenal esté corriendo con el prompt v2." />
            : <AvisoViejo periodo={d.periodo} que="Ninguna corrida automática mide todavía el manejo de contratos." detalle="Hasta que se agregue al clasificador, este dato no se actualiza." />)}
          <div className="bg-white rounded-xl p-4 mb-6 border-l-4 border-coral shadow-sm">
            <p className="text-sm text-gray-700 mb-1.5">
              Mide qué tan bien maneja cada asesor los <strong>cambios al contrato</strong> que pide el cliente. {d.corrida
                ? <>Corrida del {d.periodo}: <strong>{d.team.contractConvs} conversaciones de contrato</strong> dentro de la muestra de {d.team.convsTotal} que lee la IA. Por agente son pocas: los de menos de {RES_MIN_N} van en gris.</>
                : <>Sobre una muestra grande: <strong>{d.team.contractConvs} conversaciones de contrato</strong> (~20 por agente).</>}
            </p>
            <p className="text-xs text-gray-500">
              ⚠️ La causa raíz de que un cambio no se aplique suele estar <strong>aguas arriba (Legal/contratos)</strong>, no en el asesor. Esta vista muestra dónde se concentra y, sobre todo, <strong>quién logra recuperarlo</strong> (recuperación) — la señal más atribuible al asesor.
            </p>
          </div>

          {/* CRITICAL — managers focus here */}
          {critical.length > 0 && (
            <div className="rounded-xl p-5 mb-6" style={{ background: '#FEE2E2', border: '2px solid #E8505B' }}>
              <p className="text-sm font-bold mb-1" style={{ color: '#991B1B' }}>🚩 Foco gerencial — casos críticos ({critical.length})</p>
              <p className="text-xs mb-3" style={{ color: '#7F1D1D' }}>Alto % de contratos con problema <strong>y</strong> baja recuperación (&lt;50%): los cambios fallan y no se rescatan. Empezar el coaching aquí.</p>
              <div className="flex flex-wrap gap-2">
                {critical.map(a => (
                  <span key={a.agent} className="inline-flex items-center gap-2 bg-white rounded-lg px-3 py-1.5 text-xs font-semibold" style={{ color: '#991B1B', border: '1px solid #E8505B' }}>
                    {a.agent} · {a.problemRate}% con problema · {a.recoveryPct}% recuperación
                  </span>
                ))}
              </div>
            </div>
          )}

                        <div className="text-[11px] text-gray-500">{mn} · {m.contractConvs} convs</div>
                        <div className="flex items-baseline gap-3 mt-0.5">

          <div className="bg-white rounded-xl shadow-sm overflow-hidden">

                      <td className="py-3 px-3 text-sm text-gray-400 font-mono">{i + 1}</td>

                      <td className={`py-3 px-3 text-center text-sm ${d.corrida && a.contractConvs < RES_MIN_N ? 'text-gray-400' : 'text-gray-600'}`}>{a.contractConvs}</td>

    // ─── Volumen de Mensajes ───
    function VolumeSection() {
      const [gran, setGran] = React.useState('week');   // week | month
      const [metric, setMetric] = React.useState('both'); // sent | total | both
      const [sortKey, setSortKey] = React.useState('totalPerDay');
      const [sortDir, setSortDir] = React.useState('desc');
      const V = volumeData;
      const round1 = (x) => Math.round(x * 10) / 10;
      const recs = [];
      Object.entries(V.by_agent_day).forEach(([agent, days]) => {
        Object.entries(days).forEach(([date, c]) => recs.push({ agent, date, sent: c.sent, received: c.received, total: c.total }));
      });
      const bucketKey = (date) => {
        if (gran === 'month') return date.slice(0, 7);
        const dt = new Date(date + 'T00:00:00'); const dow = (dt.getDay() + 6) % 7;
        dt.setDate(dt.getDate() - dow); return dt.toISOString().slice(0, 10);
      };
      const bucketLabel = (k) => {
        if (gran === 'month') { const [y, m] = k.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month: 'short', year: '2-digit' }); }
        return new Date(k + 'T00:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
      };
      // team buckets → avg msgs/día (normaliza meses/semanas parciales)
      const bk = {};
      recs.forEach(r => { const k = bucketKey(r.date); (bk[k] = bk[k] || { sent: 0, total: 0, days: new Set() }); bk[k].sent += r.sent; bk[k].total += r.total; bk[k].days.add(r.date); });
      const buckets = Object.keys(bk).sort().map(k => {
        const nd = bk[k].days.size || 1;
        return { key: k, label: bucketLabel(k), sentPerDay: round1(bk[k].sent / nd), totalPerDay: round1(bk[k].total / nd) };
      });
      const chartMax = Math.max(1, ...buckets.map(b => metric === 'sent' ? b.sentPerDay : b.totalPerDay));

      // per-agent: avg/día over window + trend (last third vs first third of weeks)
      const weeksSorted = [...new Set(recs.map(r => { const dt = new Date(r.date + 'T00:00:00'); const dow = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - dow); return dt.toISOString().slice(0, 10); }))].sort();
      const third = Math.max(1, Math.floor(weeksSorted.length / 3));
      const firstWeeks = new Set(weeksSorted.slice(0, third)); const lastWeeks = new Set(weeksSorted.slice(-third));
      const wk = (d) => { const dt = new Date(d + 'T00:00:00'); const dow = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - dow); return dt.toISOString().slice(0, 10); };
      const agentsBase = Object.keys(V.by_agent_day).map(agent => {
        const ds = Object.entries(V.by_agent_day[agent]);
        const nd = ds.length || 1;
        const sent = ds.reduce((s, [, c]) => s + c.sent, 0), received = ds.reduce((s, [, c]) => s + c.received, 0), total = ds.reduce((s, [, c]) => s + c.total, 0);
        const fAvg = (() => { const f = ds.filter(([d]) => firstWeeks.has(wk(d))); const days = f.length || 1; return f.reduce((s, [, c]) => s + c.total, 0) / days; })();
        const lAvg = (() => { const l = ds.filter(([d]) => lastWeeks.has(wk(d))); const days = l.length || 1; return l.reduce((s, [, c]) => s + c.total, 0) / days; })();
        const delta = fAvg > 0 ? Math.round((lAvg - fAvg) / fAvg * 100) : null;
        return { agent, days: nd, sentPerDay: round1(sent / nd), receivedPerDay: round1(received / nd), totalPerDay: round1(total / nd), delta };
      });
      const sortBy = (k) => { if (sortKey === k) setSortDir(d => d === 'desc' ? 'asc' : 'desc'); else { setSortKey(k); setSortDir(k === 'agent' ? 'asc' : 'desc'); } };
      const agents = [...agentsBase].sort((a, b) => {
        if (sortKey === 'agent') return sortDir === 'asc' ? a.agent.localeCompare(b.agent) : b.agent.localeCompare(a.agent);
        let av = a[sortKey], bv = b[sortKey]; av = av == null ? -Infinity : av; bv = bv == null ? -Infinity : bv;
        return sortDir === 'asc' ? av - bv : bv - av;
      });
      const arrow = (k) => sortKey === k ? (sortDir === 'desc' ? ' ↓' : ' ↑') : '';
      const ndays = new Set(recs.map(r => r.date)).size || 1;
      const teamSentPerDay = round1(recs.reduce((s, r) => s + r.sent, 0) / ndays);
      const teamRecvPerDay = round1(recs.reduce((s, r) => s + r.received, 0) / ndays);
      const totalMsgs = recs.reduce((s, r) => s + r.total, 0);
      const Seg = ({ value, set, opts }) => (
        <div className="inline-flex bg-navy-card rounded-lg p-1 gap-1">
          {opts.map(o => <button key={o.v} onClick={() => set(o.v)} className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-colors ${value === o.v ? 'bg-teal text-navy-dark' : 'text-gray-400 hover:text-white'}`}>{o.l}</button>)}
        </div>
      );
      const W = 920, H = 220, PADL = 40, PADB = 34, PADT = 14, n = buckets.length, bw = n ? (W - PADL - 8) / n : 0, labelEvery = Math.ceil(n / 14);
      const trendColor = (d) => d == null ? '#94A3B8' : d <= -10 ? '#2EC4B6' : d >= 10 ? '#E8505B' : '#94A3B8';

      return (
        <Section title="Volumen de Mensajes" dark id="volume">
          <div className="bg-white/5 rounded-xl p-4 mb-6 border border-white/10">
            <p className="text-sm text-gray-300">Cuántos mensajes maneja cada CS — proxy de <strong>carga de trabajo</strong>. <strong>Enviados</strong> = mensajes que manda el CS (sin auto-respuestas). <strong>Total</strong> = enviados + recibidos. Ventana <strong>{V.start_date} → {V.end_date}</strong>.</p>
            <p className="text-xs text-gray-500 mt-1.5">Se muestra <strong>promedio de mensajes/día</strong> para comparar de forma justa (meses/semanas parciales no inflan). Solo días hábiles (lun–vie), hora CDMX. La meta es que baje con el tiempo.</p>
          </div>
          <div className="flex flex-wrap items-center gap-3 mb-6">
            <Seg value={gran} set={setGran} opts={[{ v: 'week', l: 'Semana' }, { v: 'month', l: 'Mes' }]} />
            <Seg value={metric} set={setMetric} opts={[{ v: 'sent', l: 'Enviados' }, { v: 'total', l: 'Total' }, { v: 'both', l: 'Ambos' }]} />
          </div>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="bg-navy-card rounded-xl p-5"><div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Enviados/día (equipo)</div><div className="text-3xl font-extrabold text-teal">{teamSentPerDay}</div></div>
            <div className="bg-navy-card rounded-xl p-5"><div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Recibidos/día (equipo)</div><div className="text-3xl font-extrabold text-orange-400">{teamRecvPerDay}</div></div>
            <div className="bg-navy-card rounded-xl p-5"><div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Total/día (equipo)</div><div className="text-3xl font-extrabold text-white">{round1(recs.reduce((s, r) => s + r.total, 0) / ndays)}</div></div>
            <div className="bg-navy-card rounded-xl p-5"><div className="text-gray-400 text-xs uppercase tracking-wide mb-1">Agentes</div><div className="text-3xl font-extrabold text-white">{agents.length}</div></div>
          </div>
          <div className="bg-navy-card rounded-xl p-6 mb-8">
            <div className="flex items-baseline justify-between flex-wrap gap-2 mb-4">
              <h3 className="text-white text-lg font-bold">Promedio de mensajes/día · por {gran === 'week' ? 'semana' : 'mes'}</h3>
              <div className="text-xs text-gray-400 flex gap-3">
                {(metric === 'sent' || metric === 'both') && <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-teal"></span>Enviados</span>}
                {(metric === 'total' || metric === 'both') && <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: '#64748b' }}></span>Total</span>}
              </div>
            </div>
            <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ minHeight: '180px' }}>
              {[0, 0.25, 0.5, 0.75, 1].map((f, i) => { const y = PADT + (1 - f) * (H - PADT - PADB); return (<g key={i}><line x1={PADL} y1={y} x2={W} y2={y} stroke="#1e293b" strokeWidth="1" /><text x={PADL - 6} y={y + 3} textAnchor="end" fill="#64748b" fontSize="9">{Math.round(chartMax * f)}</text></g>); })}
              {buckets.map((b, i) => {
                const x = PADL + 4 + i * bw;
                const showBoth = metric === 'both';
                const bwi = showBoth ? (bw - 3) / 2 : (bw - 2);
                const totH = (b.totalPerDay / chartMax) * (H - PADT - PADB);
                const sentH = (b.sentPerDay / chartMax) * (H - PADT - PADB);
                return (
                  <g key={b.key}>
                    {(metric === 'total' || showBoth) && <rect x={x} y={H - PADB - totH} width={Math.max(1, bwi)} height={totH} rx="1" fill="#64748b" opacity="0.85"><title>{b.label}: {b.totalPerDay} total/día</title></rect>}
                    {(metric === 'sent' || showBoth) && <rect x={showBoth ? x + bwi + 3 : x} y={H - PADB - sentH} width={Math.max(1, bwi)} height={sentH} rx="1" fill="#2EC4B6" opacity="0.9"><title>{b.label}: {b.sentPerDay} enviados/día</title></rect>}
                    {(i % labelEvery === 0) && <text x={x + bw / 2} y={H - PADB + 12} textAnchor="middle" fill="#64748b" fontSize="9">{b.label}</text>}
                  </g>
                );
              })}
            </svg>
          </div>
          <div className="bg-white rounded-xl shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[680px]">
                <thead><tr className="bg-navy-dark text-white">
                  <th className="py-3 px-3 text-left text-xs font-semibold w-12">#</th>
                  <th onClick={() => sortBy('agent')} className="py-3 px-3 text-left text-xs font-semibold cursor-pointer select-none hover:bg-white/10">Agente CS{arrow('agent')}</th>
                  <th onClick={() => sortBy('sentPerDay')} className="py-3 px-3 text-center text-xs font-semibold cursor-pointer select-none hover:bg-white/10 bg-teal/20">Enviados/día{arrow('sentPerDay')}</th>
                  <th onClick={() => sortBy('receivedPerDay')} className="py-3 px-3 text-center text-xs font-semibold cursor-pointer select-none hover:bg-white/10">Recibidos/día{arrow('receivedPerDay')}</th>
                  <th onClick={() => sortBy('totalPerDay')} className="py-3 px-3 text-center text-xs font-semibold cursor-pointer select-none hover:bg-white/10">Total/día{arrow('totalPerDay')}</th>
                  <th onClick={() => sortBy('delta')} className="py-3 px-3 text-center text-xs font-semibold cursor-pointer select-none hover:bg-white/10">Tendencia (carga){arrow('delta')}</th>
                </tr></thead>
                <tbody>
                  {agents.map((a, i) => (
                    <tr key={a.agent} className={`border-b border-gray-100 ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-gray-100 transition-colors`}>
                      <td className="py-3 px-3 text-sm text-gray-400 font-mono">{i + 1}</td>
                      <td className="py-3 px-3 text-sm font-medium text-navy-dark">{a.agent}</td>
                      <td className="py-3 px-3 text-center text-sm font-bold text-navy-dark bg-teal/5">{a.sentPerDay}</td>
                      <td className="py-3 px-3 text-center text-sm text-gray-700">{a.receivedPerDay}</td>
                      <td className="py-3 px-3 text-center text-sm text-gray-700">{a.totalPerDay}</td>
                      <td className="py-3 px-3 text-center text-sm font-semibold" style={{ color: trendColor(a.delta) }}>
                        {a.delta == null ? '—' : `${a.delta <= -10 ? '↓' : a.delta >= 10 ? '↑' : '→'} ${a.delta > 0 ? '+' : ''}${a.delta}%`}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="px-4 py-3 bg-gray-50 border-t"><p className="text-xs text-gray-400"><strong>Click en cualquier encabezado</strong> para ordenar. <strong>Enviados</strong> = manda el CS · <strong>Recibidos</strong> = entrantes · <strong>Total</strong> = ambos (promedio/día, lun–vie). <strong>Tendencia</strong> compara el último tercio vs. el primer tercio en total/día — <span style={{ color: '#2EC4B6' }}>↓ verde</span> = baja la carga, <span style={{ color: '#E8505B' }}>↑ rojo</span> = sube.</p></div>
          </div>
        </Section>
      );
    }

    // Principal = las cinco métricas del Resumen y su detalle, más Feedback (lo usan
    // los Leads para dar feedback concreto). Diagnóstico = para explicar por qué se
    // movió una métrica, no para seguir la experiencia.

      { id: 'overview',    label: 'Resumen',          icon: '📊', grupo: 'principal' },
      { id: 'response',    label: '1–2 · Respuesta',  icon: '⏱️', grupo: 'principal' },
      { id: 'calls',       label: 'Llamadas',         icon: '📞', grupo: 'principal' },
      { id: 'resolution',  label: '3 · Resolución',   icon: '🎯', grupo: 'principal' },
      { id: 'agents',      label: '4 · Frustración',  icon: '😤', grupo: 'principal' },
      { id: 'contracts',   label: '5 · Contratos',    icon: '📑', grupo: 'principal' },
      { id: 'feedback',    label: 'Feedback',         icon: '📋', grupo: 'principal' },
      { id: 'response-msg',label: 'Respuesta por mensaje', icon: '💬', grupo: 'diagnostico' },
      { id: 'schedule',    label: 'Horarios de Atención', icon: '🕐', grupo: 'diagnostico' },
      { id: 'volume',      label: 'Volumen de Mensajes', icon: '📨', grupo: 'diagnostico' },
      { id: 'writing',     label: 'Escritura',        icon: '✍️', grupo: 'diagnostico' },
      { id: 'correlations',label: 'Correlaciones',    icon: '🔗', grupo: 'diagnostico' },
      { id: 'insights',    label: 'Insights y Mejoras', icon: '🔍', grupo: 'diagnostico' },
      { id: 'coverage',    label: 'Cobertura y Proceso', icon: '📡', grupo: 'diagnostico' },
    ];
    const GRUPOS = [{ id: 'principal', label: null }, { id: 'diagnostico', label: 'Diagnóstico' }];

    function SideNav({ open, onClose, active, onChange }) {
      return (
        <>
          {/* backdrop */}
          <div onClick={onClose}
            className={`fixed inset-0 z-[55] bg-black/40 transition-opacity duration-300 ${open ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}></div>
          {/* drawer */}
          <aside className={`fixed top-0 left-0 z-[60] h-full w-64 bg-navy-dark shadow-2xl transition-transform duration-300 ease-in-out ${open ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="flex items-center justify-between px-4 py-4 border-b border-white/10">
              <span className="text-sm font-semibold text-white tracking-tight">
                <span className="text-gray-400 font-normal">MoradaUno</span> · WhatsApp CS
              </span>
              <button onClick={onClose} aria-label="Cerrar menú" className="text-white/70 hover:text-white p-1 rounded hover:bg-white/10">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <nav className="p-3 flex flex-col gap-1 overflow-y-auto" style={{height: 'calc(100% - 57px)'}}>
              {GRUPOS.map(g => (
                <React.Fragment key={g.id}>
                  {g.label && <div className="mt-4 mb-1 px-3 pt-3 border-t border-white/10 text-[10px] font-mono uppercase tracking-widest text-gray-500">{g.label}</div>}
                  {TABS.filter(t => t.grupo === g.id).map(t => {
                    const isActive = active === t.id;
                    const diag = g.id === 'diagnostico';
                    return (
                      <button key={t.id} onClick={() => onChange(t.id)}
                        className={`flex items-center gap-3 px-3 ${diag ? 'py-2 text-[13px]' : 'py-2.5 text-sm'} rounded-lg text-left transition-colors ${isActive ? 'bg-teal text-navy-dark font-semibold' : diag ? 'text-gray-400 hover:bg-white/10 hover:text-white' : 'text-gray-300 hover:bg-white/10 hover:text-white'}`}>
                        <span className="w-5 text-center shrink-0">{t.icon}</span>
                        <span>{t.label}</span>
                      </button>
                    );
                  })}
                </React.Fragment>
              ))}
            </nav>
          </aside>
        </>
      );
    }

    function App() {
      const [tab, setTab] = React.useState('overview');
      const [navOpen, setNavOpen] = React.useState(false);
      // Restore tab from URL hash on load
      React.useEffect(() => {
        const hash = window.location.hash.replace('#', '');
        if (hash && TABS.find(t => t.id === hash)) setTab(hash);
        const handler = () => {
          const h = window.location.hash.replace('#', '');
          if (h && TABS.find(t => t.id === h)) setTab(h);
        };
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);
      const setTabAndHash = (id) => {
        setTab(id);
        window.location.hash = id;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setNavOpen(false);
      };
      const activeLabel = (TABS.find(t => t.id === tab) || {}).label;
      return (
        <div className="app-bg">
          <Header onToggleNav={() => setNavOpen(o => !o)} activeLabel={activeLabel} />
          <SideNav open={navOpen} onClose={() => setNavOpen(false)} active={tab} onChange={setTabAndHash} />
          {tab === 'overview' && <Resumen onJump={setTabAndHash} />}
          {tab === 'agents' && <ComparisonSection />}
          {tab === 'resolution' && <ResolutionSection />}
          {tab === 'contracts' && <ContractHandlingSection />}
          {tab === 'response' && (firstResponse ? <FirstResponseSection /> : <ResponseTimeSection />)}
          {tab === 'response-msg' && <ResponseTimeSection />}
          {tab === 'schedule' && <ScheduleSection />}
          {tab === 'volume' && <VolumeSection />}
          {tab === 'writing' && <WritingQualitySection />}
          {tab === 'calls' && <CallsSection />}
          {tab === 'feedback' && <FeedbackSection />}
          {tab === 'correlations' && <CorrelationsSection />}
          {tab === 'insights' && (
            <>
              <EvolutionOfProblemsSection />
              <TopRequestsChart />
              <FrustrationOverview />
              <ImprovementAreasSection />
            </>
          )}
          {tab === 'coverage' && <><DataCoverageSection /><StatsCards /></>}
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    }  // ─── fin de boot() ───

    // Carga los datos y recién entonces monta la app.
    fetch('data.json?v=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' al cargar data.json');
        return r.json();
      })
      .then(boot)
      .catch(function (err) {
        console.error(err);
        document.getElementById('root').innerHTML =
          '<div style="max-width:640px;margin:15vh auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;color:#0F1A33">' +
          '<h1 style="font-size:20px;font-weight:600;margin:0 0 12px">No se pudieron cargar los datos</h1>' +
          '<p style="color:#5B6478;line-height:1.6;margin:0 0 16px">El dashboard lee <code>data.json</code> del mismo directorio. ' +
          'Si abriste el archivo directo desde el disco (file://), el navegador lo bloquea: corre <code>python3 serve.py</code>.</p>' +
          '<pre style="background:#F4F5F7;padding:12px;border-radius:8px;font-size:12px;overflow-x:auto">' + String(err) + '</pre></div>';
      });
  </script>
</body>
</html>
